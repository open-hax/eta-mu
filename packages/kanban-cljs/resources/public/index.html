<!DOCTYPE html>
<html lang="en" data-uxx-theme="night-owl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban — Global Projection</title>
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #root { height: 100vh; }

    /* ── markdown (uxx tokens, knoxx parity) ── */
    .markdownPreview { color: var(--token-colors-text-default); line-height: 1.6; }
    .markdownPreview h1,.markdownPreview h2,.markdownPreview h3 { line-height: 1.2; margin: 1.2em 0 .5em; font-weight: 600; }
    .markdownPreview h1 { font-size: 1.5em; }
    .markdownPreview h2 { font-size: 1.3em; }
    .markdownPreview h3 { font-size: 1.1em; }
    .markdownPreview p { margin: 0 0 1em; line-height: 1.65; }
    .markdownPreview a { color: var(--token-colors-text-accent); text-decoration: none; }
    .markdownPreview a:hover { text-decoration: underline; }
    .markdownPreview code { padding: 0.1rem 0.25rem; border-radius: var(--token-radius-sm, 4px); background: var(--token-colors-background-surface); font-size: .88em; }
    .markdownPreview pre { padding: var(--token-spacing-300, 12px); overflow: auto; border-radius: var(--token-radius-md, 8px); background: var(--token-colors-background-surface); border: 1px solid var(--token-colors-border-default); margin: 0 0 1em; }
    .markdownPreview pre code { background: none; padding: 0; }
    .markdownPreview blockquote { border-left: 3px solid var(--token-colors-border-default); margin: 0 0 1em; padding: 4px 14px; color: var(--token-colors-text-soft); }
    .markdownPreview table { border-collapse: collapse; width: 100%; margin: 0 0 1em; }
    .markdownPreview th,.markdownPreview td { border: 1px solid var(--token-colors-border-default); padding: 7px 10px; text-align: left; }
    .markdownPreview th { background: var(--token-colors-background-surface); font-weight: 600; }
    .markdownPreview ul,.markdownPreview ol { margin: 0 0 1em; padding-left: 1.4em; }
    .markdownPreview li { margin-bottom: .25em; }
    .markdownPreview hr { border: none; border-top: 1px solid var(--token-colors-border-default); margin: 1.2em 0; }
    .markdownPreview img { max-width: 100%; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/js/main.js"></script>
</body>
</html>
