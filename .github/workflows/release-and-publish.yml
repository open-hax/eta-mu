name: Release and Publish

on:
  workflow_call:
    inputs:
      repo:
        description: "Repository in owner/name format (defaults to calling repo)"
        required: false
        type: string
        default: ""
      pr:
        description: "Merged pull request number"
        required: true
        type: number
      tag-prefix:
        description: "Tag prefix"
        required: false
        type: string
        default: "v"
      create-release:
        description: "Create GitHub release"
        required: false
        type: boolean
        default: true
      publish-npm:
        description: "Publish to npm"
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout eta-mu logic
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: open-hax/eta-mu
          ref: bafe9aa6a09406cfd83010f5e06538117dc6056c
          path: .eta-mu
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .eta-mu/packages/legacy/github/pnpm-lock.yaml

      - name: Install eta-mu dependencies
        run: pnpm --dir .eta-mu/packages/legacy/github install --frozen-lockfile --ignore-workspace

      - name: Detect changed packages
        id: detect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm --dir .eta-mu/packages/legacy/github dev detect-packages \
            --base "origin/main" \
            --workspace-glob "packages/*/"

      - name: eta-mu tarball smoke test
        if: inputs.publish-npm && hashFiles('scripts/eta-mu-publish-smoke.sh') != ''
        run: |
          pnpm install --frozen-lockfile
          scripts/eta-mu-publish-smoke.sh

      - name: Create release and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          release_flag=""
          npm_flag=""
          if [ "${{ inputs.create-release }}" = "true" ]; then
            release_flag="--create-release"
          fi
          if [ "${{ inputs.publish-npm }}" = "true" ]; then
            npm_flag="--publish-npm"
          fi
          pnpm --dir .eta-mu/packages/legacy/github dev release \
            --repo "${{ inputs.repo || github.repository }}" \
            --pr "${{ inputs.pr }}" \
            --tag-prefix "${{ inputs.tag-prefix }}" \
            $release_flag \
            $npm_flag
