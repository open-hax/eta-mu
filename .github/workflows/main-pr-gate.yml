# Generated from contracts/workflows/ by `eta-mu workflows emit` — do not edit.
# Edit the workflow resource and re-emit.
name: eta-mu-main-pr-gate
on:
  pull_request:
    branches:
      - main
    paths:
      - packages/legacy/docs/**
      - packages/legacy/github/**
      - packages/clio/**
      - packages/kondo-config/**
      - scripts/test.bb
      - scripts/lint.bb
      - pnpm-lock.yaml
      - package.json
      - pnpm-workspace.yaml
      - .github/workflows/*.yml
      - contracts/workflows/**
      - packages/eta-mu/commands/workflows.cljs
jobs:
  main-lint:
    name: main-lint
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: echo "services/ removed; no deploy scripts to lint in current layout"
  eta-mu-lint:
    name: eta-mu-lint
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@ada62bb3282a01a296659d48378b812b8e097360
        with:
          cli: 1.12.5.1654
          bb: 1.13.219
          clj-kondo: 2025.10.23
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --dir packages/extensions build
      - run: pnpm lint
  clio:
    name: clio-nbb-shadow-lint
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@ada62bb3282a01a296659d48378b812b8e097360
        with:
          cli: 1.12.5.1654
          bb: 1.13.219
          clj-kondo: 2025.10.23
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - run: |
          eta_gate_log="$(mktemp)"
          trap 'rm -f "$eta_gate_log"' EXIT
          set +e
          bash --noprofile --norc -e -o pipefail <<'ETA_MU_GATE_COMMAND' 2>&1 | tee "$eta_gate_log"
          pnpm --dir packages/clio lint
          ETA_MU_GATE_COMMAND
          eta_gate_status=("${PIPESTATUS[@]}")
          set -e
          if [ "${eta_gate_status[0]}" -ne 0 ]; then exit "${eta_gate_status[0]}"; fi
          if [ "${eta_gate_status[1]}" -ne 0 ]; then exit "${eta_gate_status[1]}"; fi
