name: eta-mu-main-pr-gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/legacy/docs/**'
      - 'packages/legacy/github/**'
      - '.github/workflows/eta-mu*.yml'

jobs:
  main-lint:
    name: main-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: echo "services/ removed; no deploy scripts to lint in current layout"

  eta-mu-lint:
    name: eta-mu-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: '10.14.0'
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint

  main-tests:
    name: main-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: node --test packages/legacy/docs/tests/*.test.cjs

  main-build:
    name: main-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: echo "services/ removed; no docker compose build in current layout"

  staging-promotion-gate:
    name: staging-promotion-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git fetch origin staging --depth=1
      - run: git merge-base --is-ancestor "${PR_HEAD_SHA}" origin/staging
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: actions/github-script@v8
        with:
          script: |
            const requiredChecks = ["deploy-staging", "staging-live-verify"];
            const { owner, repo } = context.repo;
            const ref = context.payload.pull_request.head.sha;
            const checks = await github.rest.checks.listForRef({ owner, repo, ref, per_page: 100 });
            const byName = new Map(checks.data.check_runs.map((run) => [run.name, run.conclusion]));
            const missing = requiredChecks.filter((name) => byName.get(name) !== 'success');
            if (missing.length > 0) {
              core.setFailed(`Missing successful staging checks for ${ref}: ${missing.join(', ')}`);
            }
