# Generated from contracts/workflows/ by `eta-mu workflows emit` — do not edit.
# Edit the workflow resource and re-emit.
name: eta-mu-main-pr-gate
on:
  pull_request:
    branches:
      - main
    paths:
      - packages/legacy/docs/**
      - packages/legacy/github/**
      - packages/clio/**
      - packages/kondo-config/**
      - scripts/test.bb
      - scripts/lint.bb
      - pnpm-lock.yaml
      - package.json
      - pnpm-workspace.yaml
      - .github/workflows/*.yml
      - contracts/workflows/**
      - packages/eta-mu/commands/workflows.cljs
jobs:
  main-lint:
    name: main-lint
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: echo "services/ removed; no deploy scripts to lint in current layout"
  eta-mu-lint:
    name: eta-mu-lint
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@ada62bb3282a01a296659d48378b812b8e097360
        with:
          bb: 1.13.219
          clj-kondo: 2025.10.23
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --dir packages/extensions build
      - run: pnpm lint
  clio:
    name: clio-nbb-shadow-lint
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@ada62bb3282a01a296659d48378b812b8e097360
        with:
          bb: 1.13.219
          clj-kondo: 2025.10.23
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.14.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/clio lint
      - run: pnpm --dir packages/clio test
      - run: bb scripts/lint.bb --only clio --kondo-only
      - run: bb scripts/test.bb --only clio
  main-tests:
    name: main-tests
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          package-manager-cache: false
      - run: node --test packages/legacy/docs/tests/*.test.cjs
  main-build:
    name: main-build
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: echo "services/ removed; no docker compose build in current layout"
