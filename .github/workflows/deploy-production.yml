name: eta-mu-deploy-production

on:
  push:
    branches:
      - main
    paths:
      - 'packages/legacy/docs/**'
      - 'packages/legacy/github/**'
      - '.github/workflows/eta-mu*.yml'
  workflow_dispatch:

concurrency:
  group: eta-mu-production
  cancel-in-progress: false

jobs:
  production-preflight:
    name: production-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: echo "services/ removed; deploy-production is temporarily retired until new compose/deployment target is defined"

  deploy-production:
    name: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - production-preflight
    environment: eta-mu-production
    steps:
      - uses: actions/checkout@v5
      - run: echo "services/ removed; deploy-production is temporarily retired until new compose/deployment target is defined"

  verify-production:
    name: verify-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - deploy-production
    environment: eta-mu-production
    steps:
      - uses: actions/checkout@v5
      - run: echo "services/ removed; verify-production is temporarily retired until new compose/deployment target is defined"
      - name: verify production control plane endpoint
        run: curl -fsS "${ETA_MU_PRODUCTION_VERIFY_URL}/api/control-plane/vaults" >/dev/null
        env:
          ETA_MU_PRODUCTION_VERIFY_URL: ${{ vars.ETA_MU_PRODUCTION_VERIFY_URL || 'https://eta.mu.promethean.rest' }}
