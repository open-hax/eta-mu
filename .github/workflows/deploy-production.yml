name: eta-mu-deploy-production

permissions: {}

on:
  push:
    branches:
      - main
    paths:
      - 'packages/legacy/docs/**'
      - 'packages/legacy/github/**'
      - '.github/workflows/*.yml'
  workflow_dispatch:

concurrency:
  group: eta-mu-production
  cancel-in-progress: false

jobs:
  production-preflight:
    name: production-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          package-manager-cache: false
      - run: echo "services/ removed; deploy-production is temporarily retired until new compose/deployment target is defined"

  deploy-production:
    name: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - production-preflight
    environment: eta-mu-production
    permissions: {}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - run: echo "services/ removed; deploy-production is temporarily retired until new compose/deployment target is defined"

  verify-production:
    name: verify-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - deploy-production
    environment: eta-mu-production
    permissions: {}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - run: echo "services/ removed; verify-production is temporarily retired until new compose/deployment target is defined"
