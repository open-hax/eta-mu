name: Clio lockfile refresh

on:
  push:
    branches: [feat/clio-event-sourcing-kernel]
    paths:
      - "packages/clio/package.json"
      - ".github/workflows/clio-lock-refresh.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.14.0"
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - name: Resolve lockfile without package scripts
        run: pnpm install --lockfile-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: clio-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error

  commit:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/clio-event-sourcing-kernel
      - uses: actions/download-artifact@v4
        with:
          name: clio-pnpm-lock
          path: .lock-refresh
      - name: Commit generated lockfile only
        shell: bash
        run: |
          set -euo pipefail
          cp .lock-refresh/pnpm-lock.yaml pnpm-lock.yaml
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git commit -m "build(clio): refresh native-lock dependency lockfile"
          git push origin HEAD:feat/clio-event-sourcing-kernel
