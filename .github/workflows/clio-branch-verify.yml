name: Clio branch verification
# one-shot diagnostic verifier for PR 280; remove after a terminal receipt lands

on:
  push:
    branches: ["feat/clio-event-sourcing-kernel"]
    paths:
      - ".github/workflows/clio-branch-verify.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Record Java setup phase
        shell: bash
        run: |
          at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > packages/clio/verification.edn <<EOF
          {:verification/status :running
           :verification/tested-commit "${GITHUB_SHA}"
           :verification/phase :setup-java
           :verification/at "${at}"}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/clio/verification.edn
          git commit -m "test(clio): record java setup phase"
          git push origin HEAD:feat/clio-event-sourcing-kernel

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"

      - name: Record Clojure tools setup phase
        shell: bash
        run: |
          at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > packages/clio/verification.edn <<EOF
          {:verification/status :running
           :verification/tested-commit "${GITHUB_SHA}"
           :verification/phase :setup-clojure-tools
           :verification/at "${at}"}
          EOF
          git add packages/clio/verification.edn
          git commit -m "test(clio): record clojure tools setup phase"
          git push origin HEAD:feat/clio-event-sourcing-kernel

      - name: Set up Babashka and clj-kondo
        uses: DeLaGuardo/setup-clojure@ada62bb3282a01a296659d48378b812b8e097360
        with:
          bb: "1.13.219"
          clj-kondo: "2025.10.23"

      - name: Record pnpm setup phase
        shell: bash
        run: |
          at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > packages/clio/verification.edn <<EOF
          {:verification/status :running
           :verification/tested-commit "${GITHUB_SHA}"
           :verification/phase :setup-pnpm
           :verification/at "${at}"}
          EOF
          git add packages/clio/verification.edn
          git commit -m "test(clio): record pnpm setup phase"
          git push origin HEAD:feat/clio-event-sourcing-kernel

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.14.0"
          run_install: false

      - name: Record Node setup phase
        shell: bash
        run: |
          at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > packages/clio/verification.edn <<EOF
          {:verification/status :running
           :verification/tested-commit "${GITHUB_SHA}"
           :verification/phase :setup-node
           :verification/at "${at}"}
          EOF
          git add packages/clio/verification.edn
          git commit -m "test(clio): record node setup phase"
          git push origin HEAD:feat/clio-event-sourcing-kernel

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Run phased verification
        shell: bash
        run: |
          set -euo pipefail
          : > packages/clio/verification.log

          record() {
            local status="$1"
            local phase="$2"
            local outcome="$3"
            local at
            at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            cat > packages/clio/verification.edn <<EOF
          {:verification/status :${status}
           :verification/tested-commit "${GITHUB_SHA}"
           :verification/phase :${phase}
           :verification/phase-outcome :${outcome}
           :verification/at "${at}"
           :verification/runtime {:node "22" :java "21" :pnpm "10.14.0" :bb "1.13.219" :clj-kondo "2025.10.23"}}
          EOF
            git add packages/clio/verification.edn packages/clio/verification.log
            git commit -m "test(clio): verification ${phase} ${outcome}"
            git push origin HEAD:feat/clio-event-sourcing-kernel
          }

          run_phase() {
            local phase="$1"
            local limit="$2"
            shift 2
            local log="/tmp/clio-${phase}.log"

            record running "$phase" running
            set +e
            timeout "$limit" "$@" >"$log" 2>&1
            local code=$?
            set -e

            {
              echo "===== ${phase} (exit ${code}) ====="
              tail -n 240 "$log" || true
              echo
            } >> packages/clio/verification.log

            if [[ "$code" -eq 0 ]]; then
              record running "$phase" success
            else
              record failed "$phase" failure
              exit "$code"
            fi
          }

          run_phase frozen-install 6m pnpm install --frozen-lockfile
          run_phase package-lint 3m pnpm --dir packages/clio lint
          run_phase package-test 8m pnpm --dir packages/clio test
          run_phase root-lint 3m bb scripts/lint.bb --only clio --kondo-only
          run_phase root-test 8m bb scripts/test.bb --only clio
          record passed complete success
