name: Clio branch verification
# one-shot verification target: final Clio source for PR 280

on:
  push:
    branches: ["feat/clio-event-sourcing-kernel"]
    paths:
      - ".github/workflows/clio-branch-verify.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Record verifier start
        shell: bash
        run: |
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > packages/clio/verification.edn <<EOF
          {:verification/status :running
           :verification/tested-commit "${GITHUB_SHA}"
           :verification/at "${started_at}"}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/clio/verification.edn
          git commit -m "test(clio): mark branch verification running"
          git push origin HEAD:feat/clio-event-sourcing-kernel

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Babashka and clj-kondo
        uses: DeLaGuardo/setup-clojure@ada62bb3282a01a296659d48378b812b8e097360
        with:
          bb: "1.13.219"
          clj-kondo: "2025.10.23"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.14.0"
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Verify frozen workspace lock
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee /tmp/clio-install.log

      - name: Lint Clio
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir packages/clio lint 2>&1 | tee /tmp/clio-lint.log

      - name: Test Clio under NBB and Shadow CLJS
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir packages/clio test 2>&1 | tee /tmp/clio-test.log

      - name: Prove root lint gate selects Clio
        id: root_lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bb scripts/lint.bb --only clio --kondo-only 2>&1 | tee /tmp/clio-root-lint.log

      - name: Prove root test gate selects Clio
        id: root_test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bb scripts/test.bb --only clio 2>&1 | tee /tmp/clio-root-test.log

      - name: Record verification receipt and bounded diagnostics
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          ROOT_LINT_OUTCOME: ${{ steps.root_lint.outcome }}
          ROOT_TEST_OUTCOME: ${{ steps.root_test.outcome }}
        run: |
          verified_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          status=passed
          for outcome in "$INSTALL_OUTCOME" "$LINT_OUTCOME" "$TEST_OUTCOME" "$ROOT_LINT_OUTCOME" "$ROOT_TEST_OUTCOME"; do
            if [[ "$outcome" != "success" ]]; then status=failed; fi
          done

          cat > packages/clio/verification.edn <<EOF
          {:verification/status :${status}
           :verification/tested-commit "${GITHUB_SHA}"
           :verification/at "${verified_at}"
           :verification/runtime {:node "22" :java "21" :pnpm "10.14.0" :bb "1.13.219" :clj-kondo "2025.10.23"}
           :verification/outcomes {:frozen-install :${INSTALL_OUTCOME}
                                   :package-lint :${LINT_OUTCOME}
                                   :package-test :${TEST_OUTCOME}
                                   :root-lint :${ROOT_LINT_OUTCOME}
                                   :root-test :${ROOT_TEST_OUTCOME}}}
          EOF

          {
            for pair in \
              "frozen-install:/tmp/clio-install.log" \
              "package-lint:/tmp/clio-lint.log" \
              "package-test:/tmp/clio-test.log" \
              "root-lint:/tmp/clio-root-lint.log" \
              "root-test:/tmp/clio-root-test.log"; do
              name="${pair%%:*}"
              file="${pair#*:}"
              echo "===== ${name} ====="
              if [[ -f "$file" ]]; then tail -n 160 "$file"; else echo "no log produced"; fi
              echo
            done
          } > packages/clio/verification.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/clio/verification.edn packages/clio/verification.log
          git commit -m "test(clio): record branch verification receipt"
          git push origin HEAD:feat/clio-event-sourcing-kernel

      - name: Fail when any verification command failed
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          ROOT_LINT_OUTCOME: ${{ steps.root_lint.outcome }}
          ROOT_TEST_OUTCOME: ${{ steps.root_test.outcome }}
        run: |
          for outcome in "$INSTALL_OUTCOME" "$LINT_OUTCOME" "$TEST_OUTCOME" "$ROOT_LINT_OUTCOME" "$ROOT_TEST_OUTCOME"; do
            if [[ "$outcome" != "success" ]]; then exit 1; fi
          done
