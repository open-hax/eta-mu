name: Sandbox bundle

on:
  workflow_dispatch:
    inputs:
      include_dependency_cache:
        description: Include package-manager and JVM caches in a separate short-lived artifact
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "sandbox-bundle-*"
    paths:
      - ".github/workflows/sandbox-bundle.yml"

permissions:
  contents: read

concurrency:
  group: sandbox-bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLOJURE_TOOLS_VERSION: "1.12.5.1654"
      CLOJURE_TOOLS_SHA256: "dc86cc56bc372fcef07bd87f44693eeb4b61cf5f44347883878364d03b5fb342"
      BABASHKA_VERSION: "1.13.219"
      BABASHKA_SHA256: "9ac1fe988d7001625b30ef3e3307e67f8545505a7cb49a4aa179f578115a3e09"

    steps:
      - name: Check out full repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare revision-bound source bundle
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/sandbox-export"
          rm -rf "$OUT"
          mkdir -p "$OUT"/{source,runtime,logs,toolchain,metadata}
          repo_name="${GITHUB_REPOSITORY#*/}"
          git bundle create "$OUT/source/${repo_name}.bundle" --all
          git archive --format=tar.gz --prefix="${repo_name}/" --output="$OUT/source/source.tar.gz" HEAD
          git rev-parse HEAD > "$OUT/metadata/revision.txt"
          git status --short > "$OUT/metadata/worktree.txt"
          git submodule status --recursive > "$OUT/metadata/submodules.txt" 2>&1 || true

      - name: Set up Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Set up pnpm 10.14.0
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.14.0"
          run_install: false

      - name: Set up pinned Clojure CLI
        uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08
        with:
          cli: ${{ env.CLOJURE_TOOLS_VERSION }}

      - name: Set up pinned Babashka
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/babashka-${BABASHKA_VERSION}-linux-amd64-static.tar.gz"
          install_dir="$RUNNER_TEMP/babashka-bin"
          curl -fsSL \
            "https://github.com/babashka/babashka/releases/download/v${BABASHKA_VERSION}/babashka-${BABASHKA_VERSION}-linux-amd64-static.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$BABASHKA_SHA256" "$archive" | sha256sum --check --strict -
          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/bb" --version

      - name: Detect eta-mu app credentials
        id: dependency-credentials
        env:
          ETA_MU_APP_ID: ${{ secrets.ETA_MU_APP_ID }}
          ETA_MU_APP_PRIVATE_KEY: ${{ secrets.ETA_MU_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -n "${ETA_MU_APP_ID}" && -n "${ETA_MU_APP_PRIVATE_KEY}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create cross-repository read token
        id: dependency-token
        if: steps.dependency-credentials.outputs.available == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.ETA_MU_APP_ID }}
          private-key: ${{ secrets.ETA_MU_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            katamorph
            event-ledger
          permission-contents: read

      - name: Mirror private Git dependencies
        if: steps.dependency-token.outputs.token != ''
        env:
          DEPENDENCY_TOKEN: ${{ steps.dependency-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          mirrors="$RUNNER_TEMP/private-git-mirrors"
          rm -rf "$mirrors"
          mkdir -p "$mirrors"
          authorization="$(printf 'x-access-token:%s' "${DEPENDENCY_TOKEN}" | base64 -w0)"

          mirror_repository() {
            local repository="$1"
            local destination="$mirrors/${repository}.git"
            local attempt
            for attempt in 1 2 3; do
              rm -rf "$destination"
              if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${authorization}" \
                clone --mirror \
                "https://github.com/open-hax/${repository}.git" \
                "$destination"; then
                return 0
              fi
              if [[ "$attempt" -eq 3 ]]; then
                return 1
              fi
              sleep $((attempt * 5))
            done
          }

          mirror_repository katamorph
          mirror_repository event-ledger

      - name: Install, validate, test, and build
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/sandbox-export"
          mirrors="$RUNNER_TEMP/private-git-mirrors"

          remove_mirror_rewrites() {
            git config --global --unset-all \
              "url.file://$mirrors/katamorph.git.insteadOf" || true
            git config --global --unset-all \
              "url.file://$mirrors/event-ledger.git.insteadOf" || true
          }
          trap remove_mirror_rewrites EXIT

          if [[ -d "$mirrors/katamorph.git" ]]; then
            git config --global \
              "url.file://$mirrors/katamorph.git.insteadOf" \
              "https://github.com/open-hax/katamorph.git"
          fi
          if [[ -d "$mirrors/event-ledger.git" ]]; then
            git config --global \
              "url.file://$mirrors/event-ledger.git.insteadOf" \
              "https://github.com/open-hax/event-ledger.git"
          fi

          {
            pnpm install --frozen-lockfile
            pnpm --dir packages/extensions build
            pnpm lint
            pnpm test
            pnpm build
          } 2>&1 | tee "$OUT/logs/validate.log"

      - name: Collect generated outputs and portable toolchains
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/sandbox-export"
          paths_file="$RUNNER_TEMP/sandbox-runtime-paths"
          : > "$paths_file"
          find . -type d \( -name dist -o -name 'dist-*' -o -name target -o -name coverage -o -name reports \) \
            -not -path '*/node_modules/*' \
            -not -path '*/.git/*' \
            -not -path '*/.shadow-cljs/*' \
            -print0 >> "$paths_file"
          if [[ -s "$paths_file" ]]; then
            tar --null --files-from="$paths_file" -czf "$OUT/runtime/runtime.tar.gz"
          fi

          if [[ -n "${PNPM_HOME:-}" && -d "$PNPM_HOME" ]]; then
            tar -czf "$OUT/toolchain/pnpm-home.tar.gz" -C "$(dirname "$PNPM_HOME")" "$(basename "$PNPM_HOME")"
          fi
          clojure_archive="$OUT/toolchain/clojure-tools-${CLOJURE_TOOLS_VERSION}.tar.gz"
          babashka_source="$RUNNER_TEMP/babashka-${BABASHKA_VERSION}-linux-amd64-static.tar.gz"
          babashka_archive="$OUT/toolchain/babashka-${BABASHKA_VERSION}-linux-amd64-static.tar.gz"
          curl -fsSL \
            "https://download.clojure.org/install/clojure-tools-${CLOJURE_TOOLS_VERSION}.tar.gz" \
            -o "$clojure_archive"
          install -m 0644 "$babashka_source" "$babashka_archive"
          printf '%s  %s\n' "$CLOJURE_TOOLS_SHA256" "$clojure_archive" | sha256sum --check --strict -
          printf '%s  %s\n' "$BABASHKA_SHA256" "$babashka_archive" | sha256sum --check --strict -

          for file in package.json pnpm-lock.yaml pnpm-workspace.yaml deps.edn shadow-cljs.edn; do
            [[ -f "$file" ]] && cp "$file" "$OUT/metadata/$file"
          done
          {
            node --version
            pnpm --version
            java -version
            command -v clojure >/dev/null 2>&1 && clojure -Sdescribe || true
            command -v bb >/dev/null 2>&1 && bb --version || true
          } > "$OUT/metadata/tool-versions.txt" 2>&1

          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg revision "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg generated_at "$generated_at" \
            --arg validation "$VALIDATION_OUTCOME" \
            '{
              sandbox_bundle_version: 1,
              repository: $repository,
              revision: $revision,
              ref: $ref,
              generated_at: $generated_at,
              validation: $validation,
              entrypoint: "pnpm test",
              network_required_after_restore: true,
              restore_requirements: [
                "Node.js 22 and Java 21 must be installed on the restore host",
                "Restore the bundled pnpm, Clojure, and Babashka toolchains or install the pinned versions",
                "Restore the optional dependency-cache artifact or allow network access for dependency installation"
              ]
            }' > "$OUT/manifest.json"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Package optional dependency cache
        if: github.event_name == 'workflow_dispatch' && inputs.include_dependency_cache
        shell: bash
        run: |
          set -euo pipefail
          export DEPS_OUT="$RUNNER_TEMP/sandbox-deps"
          rm -rf "$DEPS_OUT"
          mkdir -p "$DEPS_OUT"
          store="$(pnpm store path 2>/dev/null || true)"
          if [[ -n "$store" && -d "$store" ]]; then
            tar -czf "$DEPS_OUT/pnpm-store.tar.gz" -C "$(dirname "$store")" "$(basename "$store")"
          fi
          if [[ -d "$HOME/.m2/repository" ]]; then
            tar -czf "$DEPS_OUT/m2-repository.tar.gz" -C "$HOME/.m2" repository
          fi
          if [[ -d "$HOME/.gitlibs" ]]; then
            tar -czf "$DEPS_OUT/gitlibs.tar.gz" -C "$HOME" .gitlibs
          fi
          (cd "$DEPS_OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload sandbox bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eta-mu-sandbox-${{ github.sha }}
          path: ${{ runner.temp }}/sandbox-export
          if-no-files-found: error
          retention-days: 30

      - name: Upload optional dependency cache
        if: github.event_name == 'workflow_dispatch' && inputs.include_dependency_cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eta-mu-sandbox-deps-${{ github.sha }}
          path: ${{ runner.temp }}/sandbox-deps
          if-no-files-found: error
          retention-days: 7

      - name: Preserve validation result
        if: always() && steps.validate.outcome == 'failure'
        shell: bash
        run: exit 1
