name: Clio kernel lock verification

on:
  push:
    branches: [feat/clio-event-sourcing-kernel]
    paths:
      - "packages/clio/**"
      - "!packages/clio/kernel-lock-verification.txt"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/clio-kernel-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@ada62bb3282a01a296659d48378b812b8e097360
        with:
          bb: "1.13.219"
          clj-kondo: "2025.10.23"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.14.0"
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - name: Run frozen install and Clio gates
        shell: bash
        run: |
          set +e
          mkdir -p .kernel-verification
          report=.kernel-verification/report.txt
          : > "$report"
          run() {
            name="$1"
            shift
            echo "===== $name =====" >> "$report"
            "$@" >> "$report" 2>&1
            code=$?
            echo "STATUS $name $code" >> "$report"
            return 0
          }
          run install pnpm install --frozen-lockfile
          if grep -q '^STATUS install 0$' "$report"; then
            run lint pnpm --dir packages/clio lint
            run test-nbb pnpm --dir packages/clio run test:nbb
            run test-shadow pnpm --dir packages/clio run test:shadow
          else
            echo "STATUS lint 125" >> "$report"
            echo "STATUS test-nbb 125" >> "$report"
            echo "STATUS test-shadow 125" >> "$report"
          fi
          printf 'HEAD %s\n' "$GITHUB_SHA" >> "$report"
      - uses: actions/upload-artifact@v4
        with:
          name: clio-kernel-verification
          path: .kernel-verification/report.txt
          if-no-files-found: error

  record:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/clio-event-sourcing-kernel
      - uses: actions/download-artifact@v4
        with:
          name: clio-kernel-verification
          path: .kernel-verification
      - name: Commit verification report only
        shell: bash
        run: |
          set -euo pipefail
          cp .kernel-verification/report.txt packages/clio/kernel-lock-verification.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/clio/kernel-lock-verification.txt
          git commit -m "test(clio): record kernel lock verification"
          git push origin HEAD:feat/clio-event-sourcing-kernel
