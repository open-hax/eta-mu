name: Append Rheos EDN Config Receipt

permissions:
  contents: write

on:
  push:
    branches: [feature/rheos-edn-config]
    paths:
      - ".github/workflows/append-rheos-edn-config-receipt.yml"

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rheos-edn-config
          fetch-depth: 0

      - name: Append Receipt River entry
        shell: bash
        run: |
          ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '%s\n' "{:ts \"${ts}\", :kind :decision, :repo \"https://github.com/open-hax/eta-mu\", :origin \"chatgpt\", :owner \"gpt-5.6-thinking\", :dod \"Implement Rheos EDN-first configuration and explicit card-projection discovery, preserve deprecated JSON compatibility, and design the branch-worldline ledger migration where Markdown cards and snapshots are rebuildable projections.\", :pi \"eta-mu/receipt-river-v1\", :host \"github-actions/ubuntu-latest\", :manifest \"PR #158; packages/rheos config/task-store/FSM/tests/docs; openhax.kanban.edn; compatibility JSON mirror; ledger-authority design; Rheos epic and bounded pass cards; permanent Rheos CI\", :refs \"PR #158; tested head 71abb12a9b5b1d327354483307e9407680c5b98c; Rheos workflow run 30389521645; guarded fix commit 2d608eb66fc782f7dddb66edb4a3f8605c14f213\", :tests \"Permanent Rheos workflow passed package tests, zero-warning clj-kondo, and release build on tested head 71abb12. Guarded source-fix workflow also passed the same gates before commit.\", :decisions \"EDN is the preferred config authority; JSON remains a deprecated compatibility mirror until legacy kanban is migrated; card-projection paths are explicit materialization/discovery inputs; current mutation ledger is not yet reconstructable truth; Git ancestry plus worktree-local pending events is the proposed worldline visibility rule; full fold, attribution, snapshots, and push/pull/sync remain separate cards.\", :note \"Remote GitHub work only. No user-local eta-mu/Rheos command, branch switch, multi-worktree test, or local filesystem state was invoked. The temporary receipt workflow is removed by the connector after this append.\"}" >> receipts.edn

      - name: Commit receipt only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receipts.edn
          git commit -m "docs: record Rheos EDN projection receipt"
          git push origin HEAD:feature/rheos-edn-config
