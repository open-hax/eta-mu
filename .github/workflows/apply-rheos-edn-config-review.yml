name: Apply Rheos EDN Config Review

permissions:
  contents: write

on:
  push:
    branches: [feature/rheos-edn-config]
    paths:
      - ".github/workflows/apply-rheos-edn-config-review.yml"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rheos-edn-config
          fetch-depth: 0

      - name: Apply guarded source fixes
        run: python3 scripts/apply_rheos_edn_config_review.py

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"

      - uses: pnpm/action-setup@v4
        with:
          version: "10.14.0"
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install clj-kondo
        run: |
          curl -sLO https://raw.githubusercontent.com/clj-kondo/clj-kondo/master/script/install-clj-kondo
          chmod +x install-clj-kondo
          sudo ./install-clj-kondo

      - name: Run Rheos tests
        run: pnpm -C packages/rheos test

      - name: Run clj-kondo
        run: pnpm -C packages/rheos lint:kondo

      - name: Build Rheos release targets
        run: pnpm -C packages/rheos build

      - name: Commit tested source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/rheos/src/rheos/backend/infra/agent_tools.cljs \
                  packages/rheos/src/rheos/backend/infra/task_store.cljs \
                  packages/rheos/test/rheos/backend/infra/task_store_test.cljs
          git commit -m "fix(rheos): preserve explicit projection intent"
          git push origin HEAD:feature/rheos-edn-config
