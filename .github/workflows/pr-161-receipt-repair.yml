name: PR 161 receipt repair

on:
  push:
    branches:
      - agent/ledger-protocol-packages
    paths:
      - .github/workflows/pr-161-receipt-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Repair receipt and remove workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python3 - <<'PY'
          from pathlib import Path

          path = Path("receipts.edn")
          text = path.read_text()
          needle = ':origin "ledger-protocol-packages-first-vertical-slice", :owner "codex"}'
          replacement = ':origin "ledger-protocol-packages-first-vertical-slice", :repo "/home/err/spaces/eta-mu", :owner "codex"}'
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f"expected exactly one target receipt, found {count}")
          path.write_text(text.replace(needle, replacement, 1))
          PY
          git rm .github/workflows/pr-161-receipt-repair.yml
          git config user.name "eta-mu-ai[bot]"
          git config user.email "eta-mu-ai[bot]@users.noreply.github.com"
          git add receipts.edn
          git commit -m "Fix missing repository in protocol receipt"
          git push origin HEAD:"$GITHUB_REF_NAME"
