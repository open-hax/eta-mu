# SPDX-License-Identifier: GPL-3.0-or-later
name: Sol Trusted Integration

on:
  push:
    branches: [main, staging]
    paths:
      - "packages/sol/**"
      - "packages/turn-processor/**"
      - "packages/eta-mu/**"
      - ".github/workflows/sol-ci.yml"
      - ".github/workflows/sol-trusted-integration.yml"
      - ".github/scripts/sol-ci-workflow.test.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out canonical push revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact and clean canonical checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          expected_sha="$EXPECTED_SHA"
          executed_sha="$(git rev-parse HEAD)"
          checkout_status="$(git status --porcelain --untracked-files=all)"
          if [[ ! "$expected_sha" =~ ^[0-9a-f]{40}$ || "$executed_sha" != "$expected_sha" ]]; then
            echo "::error::Trusted Sol integration did not check out exact canonical revision $expected_sha."
            exit 1
          fi
          if [[ -n "$checkout_status" ]]; then
            echo "::error::Trusted Sol integration checkout was dirty before validation."
            printf '%s\n' "$checkout_status"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Clojure CLI and clj-kondo
        uses: DeLaGuardo/setup-clojure@ada62bb3282a01a296659d48378b812b8e097360 # 13.4
        with:
          cli: 1.12.5.1654
          clj-kondo: 2025.10.23

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.14.0"
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Lint Sol canonical source and tests
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir packages/sol lint 2>&1 | tee sol-lint.log

      - name: Require eta-mu app credentials
        id: dependency-credentials
        env:
          ETA_MU_APP_ID: ${{ secrets.ETA_MU_APP_ID }}
          ETA_MU_APP_PRIVATE_KEY: ${{ secrets.ETA_MU_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "$ETA_MU_APP_ID" || -z "$ETA_MU_APP_PRIVATE_KEY" ]]; then
            echo "::error::ETA_MU_APP_ID / ETA_MU_APP_PRIVATE_KEY are unavailable for trusted Sol integration."
            exit 1
          fi

      - name: Create private-dependency read token
        id: dependency-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.ETA_MU_APP_ID }}
          private-key: ${{ secrets.ETA_MU_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            katamorph
            event-ledger
          permission-contents: read

      - name: Configure private Git dependency reads
        env:
          DEPENDENCY_TOKEN: ${{ steps.dependency-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DEPENDENCY_TOKEN" ]]; then
            echo "::error::The eta-mu GitHub App did not mint a dependency token."
            exit 1
          fi
          authorization="$(printf 'x-access-token:%s' "$DEPENDENCY_TOKEN" | base64 -w0)"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic ${authorization}"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Sol
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir packages/sol test 2>&1 | tee sol-test.log
          grep -q "0 failures, 0 errors" sol-test.log
          if grep -E "(^|[[:space:]])WARNING([:[:space:]]|$)" sol-test.log; then
            echo "Sol test compilation emitted warnings"
            exit 1
          fi

      - name: Build Sol server
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir packages/sol build 2>&1 | tee sol-build.log
          if grep -E "(^|[[:space:]])WARNING([:[:space:]]|$)" sol-build.log; then
            echo "Sol server compilation emitted warnings"
            exit 1
          fi

      - name: Remove private Git authorization
        if: ${{ always() }}
        run: git config --global --unset-all http.https://github.com/.extraheader || true

      - name: Seal bounded Sol validation evidence
        if: ${{ always() }}
        shell: bash
        env:
          SOL_EVIDENCE_DIRECTORY: ${{ runner.temp }}/sol-validation-evidence
        run: |
          set -euo pipefail
          rm -rf "$SOL_EVIDENCE_DIRECTORY"
          install -d -m 0700 "$SOL_EVIDENCE_DIRECTORY"

          for log in sol-lint.log sol-test.log sol-build.log; do
            if [[ -L "$log" ]]; then
              echo "::error::Refusing symbolic-link Sol validation log: $log" >&2
              exit 1
            fi
            if [[ -f "$log" ]]; then
              cp --no-preserve=mode,ownership "$log" "$SOL_EVIDENCE_DIRECTORY/$log"
            fi
          done

          manifest="$RUNNER_TEMP/sol-validation-evidence.SHA256SUMS"
          (cd "$SOL_EVIDENCE_DIRECTORY" && find . -maxdepth 1 -type f -name 'sol-*.log' -print0 | sort -z | xargs -0 -r sha256sum) > "$manifest"
          mv "$manifest" "$SOL_EVIDENCE_DIRECTORY/SHA256SUMS"

      - name: Upload Sol validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sol-trusted-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sol-validation-evidence
          if-no-files-found: error
          retention-days: 14
