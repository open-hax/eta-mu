name: eta-mu-deploy-staging

permissions: {}

on:
  push:
    branches:
      - staging
    paths:
      - 'packages/legacy/docs/**'
      - 'packages/legacy/github/**'
      - '.github/workflows/*.yml'
  workflow_dispatch:

concurrency:
  group: eta-mu-staging
  cancel-in-progress: true

jobs:
  staging-preflight:
    name: staging-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          package-manager-cache: false
      - run: echo "services/ removed; deploy-staging is temporarily retired until new compose/deployment target is defined"

  deploy-staging:
    name: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - staging-preflight
    environment: eta-mu-staging
    permissions: {}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - run: echo "services/ removed; deploy-staging is temporarily retired until new compose/deployment target is defined"

  staging-live-verify:
    name: staging-live-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - deploy-staging
    environment: eta-mu-staging
    permissions: {}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - run: echo "services/ removed; staging-live-verify is temporarily retired until new compose/deployment target is defined"
