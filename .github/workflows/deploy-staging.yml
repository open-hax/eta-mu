name: eta-mu-deploy-staging

on:
  push:
    branches:
      - staging
    paths:
      - 'packages/legacy/docs/**'
      - 'packages/legacy/github/**'
      - '.github/workflows/eta-mu*.yml'
  workflow_dispatch:

concurrency:
  group: eta-mu-staging
  cancel-in-progress: true

jobs:
  staging-preflight:
    name: staging-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: echo "services/ removed; deploy-staging is temporarily retired until new compose/deployment target is defined"

  deploy-staging:
    name: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - staging-preflight
    environment: eta-mu-staging
    steps:
      - uses: actions/checkout@v5
      - run: echo "services/ removed; deploy-staging is temporarily retired until new compose/deployment target is defined"

  staging-live-verify:
    name: staging-live-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - deploy-staging
    environment: eta-mu-staging
    steps:
      - uses: actions/checkout@v5
      - run: echo "services/ removed; staging-live-verify is temporarily retired until new compose/deployment target is defined"
