name: Rheos GitHub Issue Sync

on:
  workflow_call:
    inputs:
      eta-mu-ref:
        description: "Exact eta-mu ref containing both this workflow and the Rheos implementation"
        required: true
        type: string
      repo:
        description: "Repository in owner/name format (defaults to calling repository)"
        required: false
        default: ""
        type: string
      tasks-dir:
        description: "Board task root in the calling repository"
        required: false
        default: "kanban"
        type: string
      dry-run:
        description: "Plan without mutating GitHub Issues"
        required: false
        default: false
        type: boolean
      max-writes:
        description: "Maximum GitHub API writes per run"
        required: false
        default: 50
        type: number
      write-delay-ms:
        description: "Delay between GitHub API writes"
        required: false
        default: 1000
        type: number
      close-done:
        description: "Close issues whose canonical Rheos status is done"
        required: false
        default: true
        type: boolean
      close-rejected:
        description: "Close issues whose canonical Rheos status is rejected"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  github-issue-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout matching eta-mu implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: open-hax/eta-mu
          ref: ${{ inputs.eta-mu-ref }}
          path: .eta-mu
          persist-credentials: false

      - name: Verify eta-mu checkout
        shell: bash
        run: |
          set -euo pipefail
          test -f .eta-mu/packages/rheos/package.json
          echo "eta-mu ref: ${{ inputs.eta-mu-ref }}"
          echo "eta-mu commit: $(git -C .eta-mu rev-parse HEAD)"

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.14.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: .eta-mu/pnpm-lock.yaml

      - name: Install eta-mu workspace
        run: pnpm --dir .eta-mu install --frozen-lockfile

      - name: Build Rheos projection executables
        run: pnpm --dir .eta-mu/packages/rheos exec shadow-cljs release cli github-sync

      - name: Resolve board path
        id: board
        shell: bash
        env:
          TASKS_DIR: ${{ inputs.tasks-dir }}
        run: |
          set -euo pipefail
          if [[ -z "$TASKS_DIR" || "$TASKS_DIR" = /* ]]; then
            echo "::error::tasks-dir must be a non-empty path relative to the calling repository"
            exit 1
          fi

          workspace="$(realpath "$GITHUB_WORKSPACE")"
          candidate="$GITHUB_WORKSPACE/$TASKS_DIR"
          if [[ ! -d "$candidate" ]]; then
            echo "::error::Rheos board directory does not exist: $candidate"
            exit 1
          fi
          tasks_path="$(realpath "$candidate")"
          case "$tasks_path" in
            "$workspace"/*) ;;
            *)
              echo "::error::tasks-dir escapes the calling repository: $TASKS_DIR"
              exit 1
              ;;
          esac

          if [[ "$tasks_path" == "$workspace/.eta-mu"* ]]; then
            echo "::error::tasks-dir must target the calling repository"
            exit 1
          fi

          echo "tasks-path=$tasks_path" >> "$GITHUB_OUTPUT"

      - name: Generate canonical Rheos snapshot
        env:
          TASKS_PATH: ${{ steps.board.outputs.tasks-path }}
          SNAPSHOT_PATH: ${{ runner.temp }}/rheos-github-sync/board.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SNAPSHOT_PATH")"
          node .eta-mu/packages/rheos/dist/cli.cjs board snapshot \
            --tasks-dir "$TASKS_PATH" \
            --out "$SNAPSHOT_PATH"

      - name: Refuse duplicate UUIDs or noncanonical aliases
        env:
          SNAPSHOT_PATH: ${{ runner.temp }}/rheos-github-sync/board.json
        run: |
          node <<'NODE'
          const snapshot = require(process.env.SNAPSHOT_PATH);
          const tasks = snapshot.columns.flatMap((column) => column.tasks);
          const seen = new Map();
          const errors = [];

          for (const task of tasks) {
            const prior = seen.get(task.uuid);
            if (prior) errors.push(`duplicate task uuid ${task.uuid}: ${prior} and ${task['source-path']}`);
            else seen.set(task.uuid, task['source-path']);
            if (task.status === 'pending' || task.status === 'completed') {
              errors.push(`noncanonical status ${task.status} survived normalization for ${task.uuid}`);
            }
          }

          if (errors.length) {
            for (const error of errors) console.error(`::error::${error}`);
            process.exit(1);
          }
          console.log(`Validated ${tasks.length} canonical Rheos tasks`);
          NODE

      - name: Record Rheos drift history
        env:
          TASKS_PATH: ${{ steps.board.outputs.tasks-path }}
          DRIFT_PATH: ${{ runner.temp }}/rheos-github-sync/drift.txt
        run: |
          set -euo pipefail
          node .eta-mu/packages/rheos/dist/cli.cjs drift \
            --tasks-dir "$TASKS_PATH" | tee "$DRIFT_PATH"

      - name: Project Rheos tasks to GitHub Issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ inputs.repo || github.repository }}
          TASKS_PATH: ${{ steps.board.outputs.tasks-path }}
          DRY_RUN: ${{ inputs.dry-run }}
          MAX_WRITES: ${{ inputs.max-writes }}
          WRITE_DELAY_MS: ${{ inputs.write-delay-ms }}
          CLOSE_DONE: ${{ inputs.close-done }}
          CLOSE_REJECTED: ${{ inputs.close-rejected }}
          SYNC_PATH: ${{ runner.temp }}/rheos-github-sync/sync.txt
        run: |
          set -euo pipefail
          node .eta-mu/packages/rheos/dist/github-sync.cjs \
            --repo "$TARGET_REPO" \
            --tasks-dir "$TASKS_PATH" \
            --cwd "$GITHUB_WORKSPACE" \
            --dry-run "$DRY_RUN" \
            --max-writes "$MAX_WRITES" \
            --write-delay-ms "$WRITE_DELAY_MS" \
            --close-done "$CLOSE_DONE" \
            --close-rejected "$CLOSE_REJECTED" | tee "$SYNC_PATH"

      - name: Publish sync summary
        if: always()
        env:
          TARGET_REPO: ${{ inputs.repo || github.repository }}
          DRY_RUN: ${{ inputs.dry-run }}
          SYNC_PATH: ${{ runner.temp }}/rheos-github-sync/sync.txt
          DRIFT_PATH: ${{ runner.temp }}/rheos-github-sync/drift.txt
        run: |
          {
            echo "## Rheos GitHub Issue sync"
            echo
            echo "- repository: \`$TARGET_REPO\`"
            echo "- dry run: \`$DRY_RUN\`"
            echo "- canonical aliases: \`pending → incoming\`, \`completed → done\`"
            echo "- historical drift events: \`$(grep -c ' DRIFT ' "$DRIFT_PATH" 2>/dev/null || true)\`"
            if [[ -f "$SYNC_PATH" ]]; then
              echo
              echo '```text'
              cat "$SYNC_PATH"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Rheos sync evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rheos-github-issue-sync
          path: ${{ runner.temp }}/rheos-github-sync/
          if-no-files-found: warn
          retention-days: 14
