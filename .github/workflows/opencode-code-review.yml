          KTsKfQoKaWYgKHByb2Nlc3MuYXJndlsxXSAmJiBwYXRoLnJlc29sdmUocHJvY2Vzcy5hcmd2WzFdKSA9PT0gZmlsZVVSTFRvUGF0aChpbXBvcnQubWV0YS51
          cmwpKSB7CiAgbWFpbigpLmNhdGNoKChlcnJvcikgPT4gewogICAgY29uc29sZS5lcnJvcihgOjplcnJvcjo6JHtlcnJvci5tZXNzYWdlfWApOwogICAgcHJv
          Y2Vzcy5leGl0Q29kZSA9IDE7CiAgfSk7Cn0K
          ETA_MU_RECOVERY_RUNNER_BASE64

          printf '%s\n' "$MUSE_REVISION" > "$CONTEXT_OUT/metadata/muse-revision.txt"
          printf '%s\n' "$AGENTS_REVISION" > "$CONTEXT_OUT/metadata/agents-revision.txt"
          (cd "$CONTEXT_OUT/agents" && find skills -name SKILL.md -type f -print | sort) > "$CONTEXT_OUT/metadata/skills.txt"
          if find "$CONTEXT_OUT" -type l -print -quit | grep -q .; then
            echo "::error::Review context contains a symbolic link and cannot be sealed." >&2
            exit 1
          fi
          sums_file="$RUNNER_TEMP/opencode-review-context.SHA256SUMS"
          (cd "$CONTEXT_OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum) > "$sums_file"
          mv "$sums_file" "$CONTEXT_OUT/SHA256SUMS"

      - name: Bind review-context artifact name
        id: context_artifact_name
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: printf 'name=review-context-%s-%s\n' "$RUN_ID" "$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload review context
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.context_artifact_name.outputs.name }}
          path: ${{ runner.temp }}/opencode-review-context
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  review:
    name: Review pull request with OpenCode MiMo
    needs: [resolve_pull_request, deterministic_evidence, prepare_review_context]
    if: ${{ always() && needs.resolve_pull_request.outputs.eligible == 'true' && needs.deterministic_evidence.result == 'success' && needs.prepare_review_context.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      expected_sha: ${{ steps.review_completion.outputs.expected_sha }}
      executed_sha: ${{ steps.review_completion.outputs.executed_sha }}
      completion_sha: ${{ steps.review_completion.outputs.completion_sha }}
      exact_head: ${{ steps.review_completion.outputs.exact_head }}
      clean: ${{ steps.review_completion.outputs.clean }}
      submission_artifact: ${{ steps.submission_artifact_name.outputs.name }}
      submission_sha256: ${{ steps.prepare_submission.outputs.sha256 }}
      started_at: ${{ steps.review_start.outputs.started_at }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve_pull_request.outputs.requested_head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact and clean review checkout
        id: review_checkout
        shell: bash
        env:
          EVENT_PR_HEAD_SHA: ${{ needs.resolve_pull_request.outputs.head_sha }}
          PR_HEAD_SHA: ${{ needs.resolve_pull_request.outputs.requested_head_sha }}
        run: |
          set -euo pipefail
          event_head_sha="$EVENT_PR_HEAD_SHA"
          expected_sha="$PR_HEAD_SHA"
          executed_sha="$(git rev-parse HEAD)"
          checkout_status="$(git status --porcelain --untracked-files=all)"
          expected_commit=false
          event_head_matches=false
          exact_head=false
          clean=false
          if [[ "$expected_sha" =~ ^[0-9a-f]{40}$ || "$expected_sha" =~ ^[0-9a-f]{64}$ ]]; then
            git cat-file -e "${expected_sha}^{commit}" 2>/dev/null && expected_commit=true
          fi
          if [[ "$event_head_sha" =~ ^[0-9a-f]{40}$ || "$event_head_sha" =~ ^[0-9a-f]{64}$ ]]; then
            [[ "$expected_sha" == "$event_head_sha" ]] && event_head_matches=true
          fi
          [[ "$expected_commit" == true && "$event_head_matches" == true && "$executed_sha" == "$expected_sha" ]] && exact_head=true
          [[ -z "$checkout_status" ]] && clean=true
          {
            echo "event_head_sha=$event_head_sha"
            echo "expected_sha=$expected_sha"
            echo "executed_sha=$executed_sha"
            echo "expected_commit=$expected_commit"
            echo "event_head_matches=$event_head_matches"
            echo "exact_head=$exact_head"
            echo "clean=$clean"
          } >> "$GITHUB_OUTPUT"
          if [[ "$expected_commit" != true ]]; then
            echo "::error::Expected review revision is not an available immutable commit: $expected_sha"
            exit 1
          fi
          if [[ "$event_head_matches" != true ]]; then
            echo "::error::Caller-selected review head $expected_sha does not match event head $event_head_sha."
            exit 1
          fi
          if [[ "$exact_head" != true ]]; then
            echo "::error::Expected pull-request head $expected_sha but review checkout executed $executed_sha."
            exit 1
          fi
          if [[ "$clean" != true ]]; then
            echo "::error::Pull-request checkout was dirty before review execution."
            printf '%s\n' "$checkout_status"
            exit 1
          fi

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Prepare trusted review artifact directories
        shell: bash
        env:
          DETERMINISTIC_EVIDENCE_DIRECTORY: ${{ runner.temp }}/trusted-deterministic-evidence
          REVIEW_CONTEXT_DIRECTORY: ${{ runner.temp }}/trusted-review-context
        run: |
          set -euo pipefail
          rm -rf "$DETERMINISTIC_EVIDENCE_DIRECTORY" "$REVIEW_CONTEXT_DIRECTORY"
          install -d -m 0700 "$DETERMINISTIC_EVIDENCE_DIRECTORY" "$REVIEW_CONTEXT_DIRECTORY"

      - name: Download deterministic evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.deterministic_evidence.outputs.artifact_name }}
          path: ${{ runner.temp }}/trusted-deterministic-evidence

      - name: Download Muse tools and global skills
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.prepare_review_context.outputs.artifact_name }}
          path: ${{ runner.temp }}/trusted-review-context

      - name: Verify trusted review artifact manifests
        shell: bash
        env:
          DETERMINISTIC_EVIDENCE_DIRECTORY: ${{ runner.temp }}/trusted-deterministic-evidence
          REVIEW_CONTEXT_DIRECTORY: ${{ runner.temp }}/trusted-review-context
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          function refuse(message) {
            throw new Error(`Trusted artifact refused: ${message}`);
          }

          function verifyExactManifest(label, inputRoot) {
            if (!inputRoot) refuse(`${label} directory is missing`);
            const root = path.resolve(inputRoot);
            const rootStat = fs.lstatSync(root);
            if (!rootStat.isDirectory() || rootStat.isSymbolicLink()) refuse(`${label} root is not a plain directory`);

            const manifestPath = path.join(root, 'SHA256SUMS');
            const manifestStat = fs.lstatSync(manifestPath);
            if (!manifestStat.isFile() || manifestStat.isSymbolicLink()) refuse(`${label} manifest is not a plain file`);
            const manifest = fs.readFileSync(manifestPath, 'utf8');
            if (!manifest.endsWith('\n')) refuse(`${label} manifest is not newline terminated`);

            const expectedFiles = new Map();
            const expectedDirectories = new Set(['.']);
            for (const line of manifest.slice(0, -1).split('\n')) {
              const match = /^([0-9a-f]{64})  (\.\/[^\r\n]+)$/.exec(line);
              if (!match) refuse(`${label} manifest contains a malformed entry`);
              const [, expectedDigest, relative] = match;
              const segments = relative.slice(2).split('/');
              if (segments.some((segment) => !segment || segment === '.' || segment === '..' || /[\\\r\n]/.test(segment))) {
                refuse(`${label} manifest contains an unsafe path`);
              }
              if (relative === './SHA256SUMS' || expectedFiles.has(relative)) {
                refuse(`${label} manifest contains a reserved or duplicate path`);
              }
              for (let index = 1; index < segments.length; index += 1) {
                expectedDirectories.add(`./${segments.slice(0, index).join('/')}`);
              }
              expectedFiles.set(relative, expectedDigest);
            }
            if (expectedFiles.size === 0) refuse(`${label} manifest is empty`);

            const actualFiles = new Set();
            const actualDirectories = new Set(['.']);
            function walk(directory) {
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                if (/[\\\r\n]/.test(entry.name)) refuse(`${label} contains an unsafe entry name`);
                const absolute = path.join(directory, entry.name);
                const stat = fs.lstatSync(absolute);
                const relative = `./${path.relative(root, absolute).split(path.sep).join('/')}`;
                if (stat.isSymbolicLink()) refuse(`${label} contains a symbolic link: ${relative}`);
                if (stat.isDirectory()) {
                  actualDirectories.add(relative);
                  walk(absolute);
                } else if (stat.isFile()) {
                  if (relative !== './SHA256SUMS') actualFiles.add(relative);
                } else {
                  refuse(`${label} contains a non-file entry: ${relative}`);
                }
              }
            }
            walk(root);

            const sorted = (values) => [...values].sort();
            if (JSON.stringify(sorted(actualFiles)) !== JSON.stringify(sorted(expectedFiles.keys()))) {
              refuse(`${label} contains missing or unmanifested files`);
            }
            if (JSON.stringify(sorted(actualDirectories)) !== JSON.stringify(sorted(expectedDirectories))) {
              refuse(`${label} contains unmanifested directories`);
            }
            for (const [relative, expectedDigest] of expectedFiles) {
              const absolute = path.join(root, ...relative.slice(2).split('/'));
              const stat = fs.lstatSync(absolute);
              if (!stat.isFile() || stat.isSymbolicLink()) refuse(`${label} entry is not a plain file: ${relative}`);
              const actualDigest = crypto.createHash('sha256').update(fs.readFileSync(absolute)).digest('hex');
              if (actualDigest !== expectedDigest) refuse(`${label} digest mismatch: ${relative}`);
            }
          }

          verifyExactManifest('deterministic evidence', process.env.DETERMINISTIC_EVIDENCE_DIRECTORY);
          verifyExactManifest('review context', process.env.REVIEW_CONTEXT_DIRECTORY);
          NODE

      - name: Verify and install the bounded review context
        shell: bash
        env:
          REVIEW_CONTEXT_DIRECTORY: ${{ runner.temp }}/trusted-review-context
        run: |
          set -euo pipefail

          # Install into the runner-global opencode config. Caller repositories
          # may track their own .opencode/ tree; nothing in this step may write
          # there. The runner is disposable, so the global config is ours.
          GLOBAL_CFG="$HOME/.config/opencode"
          RUNTIME="$HOME/.eta-mu-review"
          rm -rf "$RUNTIME" "$GLOBAL_CFG"
          mkdir -p "$GLOBAL_CFG/plugins" "$GLOBAL_CFG/agents" "$RUNTIME"

          cp -a "$REVIEW_CONTEXT_DIRECTORY/muse/opencode/dist" "$RUNTIME/"
          cp "$REVIEW_CONTEXT_DIRECTORY/muse/opencode/package.json" "$RUNTIME/package.json"
          npm install --prefix "$RUNTIME" --ignore-scripts --no-audit --no-fund

          printf '// Generated by the eta-mu evidence review workflow; runner-local.\nexport { EtaMuActorsPlugin } from "%s/dist/eta-mu-actors.js";\n' "$RUNTIME" \
            > "$GLOBAL_CFG/plugins/eta-mu-actors.js"
          cp "$REVIEW_CONTEXT_DIRECTORY/muse/opencode/agents/github-reviewer.md" "$GLOBAL_CFG/agents/github-reviewer.md"
          cp "$REVIEW_CONTEXT_DIRECTORY/muse/opencode/opencode.json" "$GLOBAL_CFG/opencode.json"

          rm -rf "$HOME/.agents"
          ln -s "$REVIEW_CONTEXT_DIRECTORY/agents" "$HOME/.agents"
          test -s "$HOME/.agents/skills/work-cycle/SKILL.md"
          test -s "$GLOBAL_CFG/agents/github-reviewer.md"
          test -s "$GLOBAL_CFG/plugins/eta-mu-actors.js"
          test -s "$GLOBAL_CFG/opencode.json"
          test -s "$REVIEW_CONTEXT_DIRECTORY/machinery/publish-opencode-review.cjs"
          test -s "$REVIEW_CONTEXT_DIRECTORY/machinery/evidence-review.md"

          # The reviewer must read the PR's tree, not a tree its own setup edited.
          # This counts untracked files too, deliberately: an unexpected file can
          # steer a review as easily as a modified one. Trusted artifacts live in
          # runner temp and therefore need no working-tree exception.
          if git status --porcelain --untracked-files=all | grep -q .; then
            echo "::error::Review-context setup left the working tree dirty before model execution."
            git status --short
            exit 1
          fi

          skill_count="$(find "$HOME/.agents/skills" -name SKILL.md -type f | wc -l)"
          echo "Loaded ${skill_count} global skills from riatzukiza/.agents."
          echo "Muse observer registry:"
          cat "$REVIEW_CONTEXT_DIRECTORY/metadata/exposed-tools.txt"

      - name: Test deterministic review publisher
        env:
          REVIEW_CONTEXT_DIRECTORY: ${{ runner.temp }}/trusted-review-context
        run: node --test "$REVIEW_CONTEXT_DIRECTORY/machinery/publish-opencode-review.test.cjs"

      - name: Install pinned OpenCode CLI
        shell: bash
        env:
          OPENCODE_VERSION: ${{ inputs.opencode_version || '1.18.18' }}
        run: |
          set -euo pipefail
          version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$OPENCODE_VERSION" =~ $version_pattern ]]; then
            echo "::error::OpenCode version must be one exact semantic version." >&2
            exit 1
          fi
          npm install --global "opencode-ai@$OPENCODE_VERSION"

      - name: Stage isolated review sandbox
        shell: bash
        env:
          PR_HEAD_SHA: ${{ needs.resolve_pull_request.outputs.requested_head_sha }}
          REVIEW_SANDBOX: ${{ runner.temp }}/opencode-review-sandbox
          DETERMINISTIC_EVIDENCE_DIRECTORY: ${{ runner.temp }}/trusted-deterministic-evidence
        run: |
          set -euo pipefail
          rm -rf "$REVIEW_SANDBOX"
          mkdir -p "$REVIEW_SANDBOX/source" "$REVIEW_SANDBOX/.opencode/review-evidence"

          # The exact PR tree is evidence, never OpenCode runtime configuration.
          # git archive also excludes .git and any setup-time untracked files.
          git archive --format=tar "$PR_HEAD_SHA" | tar -xf - -C "$REVIEW_SANDBOX/source"
          cp -a "$DETERMINISTIC_EVIDENCE_DIRECTORY/." "$REVIEW_SANDBOX/.opencode/review-evidence/"
          test ! -e "$REVIEW_SANDBOX/.opencode/review-evidence/submission.json"
          chmod -R a-w "$REVIEW_SANDBOX/source"

          for forbidden in \
            .git opencode.json opencode.jsonc AGENTS.md CLAUDE.md \
            .opencode/agents .opencode/commands .opencode/plugins .opencode/tools; do
            if [[ -e "$REVIEW_SANDBOX/$forbidden" ]]; then
              echo "::error::Isolated review root contains forbidden runtime configuration: $forbidden"
              exit 1
            fi
          done

      - name: Capture review start time
        id: review_start
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run bounded evidence-first OpenCode review
        env:
          OPENCODE_DISABLE_CLAUDE_CODE: "1"
          PR_NUMBER: ${{ needs.resolve_pull_request.outputs.number }}
          REVIEW_MODEL: ${{ inputs.model || 'opencode/mimo-v2.5-free' }}
          REVIEW_PROMPT_FILE: ${{ runner.temp }}/trusted-review-context/machinery/evidence-review.md
          REVIEW_EXECUTION_DIRECTORY: ${{ runner.temp }}/opencode-review-sandbox
          REVIEW_EVIDENCE_DIR: ${{ runner.temp }}/opencode-review-sandbox/.opencode/review-evidence
          REVIEW_RUNNER_FILE: ${{ runner.temp }}/trusted-review-context/machinery/run-opencode-review-recovery.mjs
        run: node "$REVIEW_RUNNER_FILE"

      - name: Upload review attempt artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-attempt-${{ needs.resolve_pull_request.outputs.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/opencode-review-sandbox/.opencode/review-evidence/model-response-attempt-1.txt
            ${{ runner.temp }}/opencode-review-sandbox/.opencode/review-evidence/model-response-attempt-2.txt
            ${{ runner.temp }}/opencode-review-sandbox/.opencode/review-evidence/opencode-stderr-attempt-1.log
            ${{ runner.temp }}/opencode-review-sandbox/.opencode/review-evidence/opencode-stderr-attempt-2.log
            ${{ runner.temp }}/opencode-review-sandbox/.opencode/review-evidence/recovery.json
            ${{ runner.temp }}/opencode-review-sandbox/.opencode/review-evidence/submission.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Verify review remained revision-bound
        id: review_completion
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.review_checkout.outputs.expected_sha }}
          EXECUTED_SHA: ${{ steps.review_checkout.outputs.executed_sha }}
          INITIAL_EXACT_HEAD: ${{ steps.review_checkout.outputs.exact_head }}
          INITIAL_CLEAN: ${{ steps.review_checkout.outputs.clean }}
        run: |
          set -euo pipefail
          completion_sha="$(git rev-parse HEAD)"
          unexpected_status="$(git status --porcelain --untracked-files=all)"
          exact_head=false
          clean=false
          if [[ "$INITIAL_EXACT_HEAD" == true && "$EXPECTED_SHA" == "$EXECUTED_SHA" && "$EXPECTED_SHA" == "$completion_sha" ]]; then
            exact_head=true
          fi
          if [[ "$INITIAL_CLEAN" == true && -z "$unexpected_status" ]]; then
            clean=true
          fi
          {
            echo "expected_sha=$EXPECTED_SHA"
            echo "executed_sha=$EXECUTED_SHA"
            echo "completion_sha=$completion_sha"
            echo "exact_head=$exact_head"
            echo "clean=$clean"
          } >> "$GITHUB_OUTPUT"
          if [[ "$exact_head" != true ]]; then
            echo "::error::Review execution moved away from exact pull-request head $EXPECTED_SHA."
            exit 1
          fi
          if [[ "$clean" != true ]]; then
            echo "::error::Review execution modified the pull-request tree."
            printf '%s\n' "$unexpected_status"
            exit 1
          fi

      - name: Bind immutable review submission artifact name
        id: submission_artifact_name
        shell: bash
        env:
          PR_NUMBER: ${{ needs.resolve_pull_request.outputs.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: printf 'name=review-submission-%s-%s-%s\n' "$PR_NUMBER" "$RUN_ID" "$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Prepare immutable review submission
        id: prepare_submission
        shell: bash
        env:
          SOURCE_SUBMISSION: ${{ runner.temp }}/opencode-review-sandbox/.opencode/review-evidence/submission.json
          SUBMISSION_DIRECTORY: ${{ runner.temp }}/immutable-review-submission
        run: |
          set -euo pipefail
          rm -rf "$SUBMISSION_DIRECTORY"
          mkdir -p "$SUBMISSION_DIRECTORY"
          test -f "$SOURCE_SUBMISSION"
          test ! -L "$SOURCE_SUBMISSION"
          jq -e 'type == "object"' "$SOURCE_SUBMISSION" >/dev/null
          cp --no-preserve=mode,ownership "$SOURCE_SUBMISSION" "$SUBMISSION_DIRECTORY/submission.json"
          chmod a-w "$SUBMISSION_DIRECTORY/submission.json"
          sha256="$(sha256sum "$SUBMISSION_DIRECTORY/submission.json" | awk '{print $1}')"
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload immutable review submission
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.submission_artifact_name.outputs.name }}
          path: ${{ runner.temp }}/immutable-review-submission/submission.json
          if-no-files-found: error
          retention-days: 14

  publish_review:
    name: Validate and publish revision-bound review
    needs: [resolve_pull_request, prepare_review_context, review]
    if: ${{ always() && needs.resolve_pull_request.outputs.eligible == 'true' && needs.prepare_review_context.result == 'success' && needs.review.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      publication_admitted: ${{ steps.publish_review.outputs.publishable }}
    env:
      HAS_DISCORD_REVIEW_WEBHOOK_URL: ${{ secrets.DISCORD_REVIEW_WEBHOOK_URL != '' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Set up Node 22 for trusted publication
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Prepare trusted publication directories
        shell: bash
        env:
          RESOLVED_PR_DIRECTORY: ${{ runner.temp }}/trusted-resolved-pull-request
          REVIEW_CONTEXT_DIRECTORY: ${{ runner.temp }}/trusted-review-context
          REVIEW_SUBMISSION_DIRECTORY: ${{ runner.temp }}/trusted-review-submission
        run: |
          set -euo pipefail
          rm -rf "$RESOLVED_PR_DIRECTORY" "$REVIEW_CONTEXT_DIRECTORY" "$REVIEW_SUBMISSION_DIRECTORY"
          install -d -m 0700 "$RESOLVED_PR_DIRECTORY" "$REVIEW_CONTEXT_DIRECTORY" "$REVIEW_SUBMISSION_DIRECTORY"

      - name: Download trusted resolved pull request context
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.resolve_pull_request.outputs.artifact_name }}
          path: ${{ runner.temp }}/trusted-resolved-pull-request

      - name: Download trusted review machinery
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.prepare_review_context.outputs.artifact_name }}
          path: ${{ runner.temp }}/trusted-review-context

      - name: Download immutable review submission
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.review.outputs.submission_artifact }}
          path: ${{ runner.temp }}/trusted-review-submission

      - name: Verify immutable publication inputs
        shell: bash
        env:
          RESOLVED_PR_FILE: ${{ runner.temp }}/trusted-resolved-pull-request/pull-request.json
          RESOLVED_PR_SHA256: ${{ needs.resolve_pull_request.outputs.context_sha256 }}
          REVIEW_CONTEXT_DIRECTORY: ${{ runner.temp }}/trusted-review-context
          REVIEW_SUBMISSION_DIRECTORY: ${{ runner.temp }}/trusted-review-submission
          REVIEW_SUBMISSION_SHA256: ${{ needs.review.outputs.submission_sha256 }}
        run: |
          set -euo pipefail
          for digest in "$RESOLVED_PR_SHA256" "$REVIEW_SUBMISSION_SHA256"; do
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::A trusted publication digest is missing or invalid." >&2
              exit 1
            fi
          done

          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          function refuse(message) {
            throw new Error(`Trusted artifact refused: ${message}`);
          }

          function verifyExactManifest(label, inputRoot) {
            if (!inputRoot) refuse(`${label} directory is missing`);
            const root = path.resolve(inputRoot);
            const rootStat = fs.lstatSync(root);
            if (!rootStat.isDirectory() || rootStat.isSymbolicLink()) refuse(`${label} root is not a plain directory`);

            const manifestPath = path.join(root, 'SHA256SUMS');
            const manifestStat = fs.lstatSync(manifestPath);
            if (!manifestStat.isFile() || manifestStat.isSymbolicLink()) refuse(`${label} manifest is not a plain file`);
            const manifest = fs.readFileSync(manifestPath, 'utf8');
            if (!manifest.endsWith('\n')) refuse(`${label} manifest is not newline terminated`);

            const expectedFiles = new Map();
            const expectedDirectories = new Set(['.']);
            for (const line of manifest.slice(0, -1).split('\n')) {
              const match = /^([0-9a-f]{64})  (\.\/[^\r\n]+)$/.exec(line);
              if (!match) refuse(`${label} manifest contains a malformed entry`);
              const [, expectedDigest, relative] = match;
              const segments = relative.slice(2).split('/');
              if (segments.some((segment) => !segment || segment === '.' || segment === '..' || /[\\\r\n]/.test(segment))) {
                refuse(`${label} manifest contains an unsafe path`);
              }
              if (relative === './SHA256SUMS' || expectedFiles.has(relative)) {
                refuse(`${label} manifest contains a reserved or duplicate path`);
              }
              for (let index = 1; index < segments.length; index += 1) {
                expectedDirectories.add(`./${segments.slice(0, index).join('/')}`);
              }
              expectedFiles.set(relative, expectedDigest);
            }
            if (expectedFiles.size === 0) refuse(`${label} manifest is empty`);

            const actualFiles = new Set();
            const actualDirectories = new Set(['.']);
            function walk(directory) {
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                if (/[\\\r\n]/.test(entry.name)) refuse(`${label} contains an unsafe entry name`);
                const absolute = path.join(directory, entry.name);
                const stat = fs.lstatSync(absolute);
                const relative = `./${path.relative(root, absolute).split(path.sep).join('/')}`;
                if (stat.isSymbolicLink()) refuse(`${label} contains a symbolic link: ${relative}`);
                if (stat.isDirectory()) {
                  actualDirectories.add(relative);
                  walk(absolute);
                } else if (stat.isFile()) {
                  if (relative !== './SHA256SUMS') actualFiles.add(relative);
                } else {
                  refuse(`${label} contains a non-file entry: ${relative}`);
                }
              }
            }
            walk(root);

            const sorted = (values) => [...values].sort();
            if (JSON.stringify(sorted(actualFiles)) !== JSON.stringify(sorted(expectedFiles.keys()))) {
              refuse(`${label} contains missing or unmanifested files`);
            }
            if (JSON.stringify(sorted(actualDirectories)) !== JSON.stringify(sorted(expectedDirectories))) {
              refuse(`${label} contains unmanifested directories`);
            }
            for (const [relative, expectedDigest] of expectedFiles) {
              const absolute = path.join(root, ...relative.slice(2).split('/'));
              const stat = fs.lstatSync(absolute);
              if (!stat.isFile() || stat.isSymbolicLink()) refuse(`${label} entry is not a plain file: ${relative}`);
              const actualDigest = crypto.createHash('sha256').update(fs.readFileSync(absolute)).digest('hex');
              if (actualDigest !== expectedDigest) refuse(`${label} digest mismatch: ${relative}`);
            }
          }

          verifyExactManifest('review context', process.env.REVIEW_CONTEXT_DIRECTORY);
          NODE
          test -f "$REVIEW_CONTEXT_DIRECTORY/machinery/publish-opencode-review.cjs"

          resolved_directory="$(dirname "$RESOLVED_PR_FILE")"
          mapfile -t resolved_entries < <(find "$resolved_directory" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          if [[ "${#resolved_entries[@]}" -ne 1 || "${resolved_entries[0]}" != pull-request.json ]]; then
            echo "::error::Trusted pull-request context artifact has unexpected entries." >&2
            exit 1
          fi
          test -f "$RESOLVED_PR_FILE"
          test ! -L "$RESOLVED_PR_FILE"

          mapfile -t submission_entries < <(find "$REVIEW_SUBMISSION_DIRECTORY" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          if [[ "${#submission_entries[@]}" -ne 1 || "${submission_entries[0]}" != submission.json ]]; then
            echo "::error::Immutable review submission artifact has unexpected entries." >&2
            exit 1
          fi
          test -f "$REVIEW_SUBMISSION_DIRECTORY/submission.json"
          test ! -L "$REVIEW_SUBMISSION_DIRECTORY/submission.json"

          resolved_digest="$(sha256sum "$RESOLVED_PR_FILE" | awk '{print $1}')"
          submission_digest="$(sha256sum "$REVIEW_SUBMISSION_DIRECTORY/submission.json" | awk '{print $1}')"
          if [[ "$resolved_digest" != "$RESOLVED_PR_SHA256" ]]; then
            echo "::error::Trusted pull-request context digest mismatch." >&2
            exit 1
          fi
          if [[ "$submission_digest" != "$REVIEW_SUBMISSION_SHA256" ]]; then
            echo "::error::Immutable review submission digest mismatch." >&2
            exit 1
          fi

      - name: Require eta-mu app credentials
        shell: bash
        env:
          ETA_MU_APP_ID: ${{ secrets.ETA_MU_APP_ID }}
          ETA_MU_APP_PRIVATE_KEY: ${{ secrets.ETA_MU_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$ETA_MU_APP_ID" || -z "$ETA_MU_APP_PRIVATE_KEY" ]]; then
            echo "::error::ETA_MU_APP_ID / ETA_MU_APP_PRIVATE_KEY are not visible to this repository."
            echo "::error::Operator action required: create the eta-mu GitHub App credentials as organization secrets with access to this repository, then re-run this workflow."
            exit 1
          fi

      - name: Create eta-mu GitHub App token for review publication
        id: eta_mu_publish_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ETA_MU_APP_ID }}
          private-key: ${{ secrets.ETA_MU_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-metadata: read
          permission-pull-requests: write

      - name: Validate final review submission
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ needs.resolve_pull_request.outputs.number }}
          PR_HEAD_SHA: ${{ needs.resolve_pull_request.outputs.head_sha }}
          PR_BASE_SHA: ${{ needs.resolve_pull_request.outputs.base_sha }}
          PR_BASE_REF: ${{ needs.resolve_pull_request.outputs.base_ref }}
          PR_DEFAULT_BASE_REF: ${{ needs.resolve_pull_request.outputs.default_base_ref }}
          PR_MERGE_SHA: ${{ needs.resolve_pull_request.outputs.merge_sha }}
          RESOLVED_PR_FILE: ${{ runner.temp }}/trusted-resolved-pull-request/pull-request.json
          RESOLVED_PR_SHA256: ${{ needs.resolve_pull_request.outputs.context_sha256 }}
          REVIEW_PUBLISHER_FILE: ${{ runner.temp }}/trusted-review-context/machinery/publish-opencode-review.cjs
          REVIEW_SUBMISSION_FILE: ${{ runner.temp }}/trusted-review-submission/submission.json
          REVIEW_SUBMISSION_SHA256: ${{ needs.review.outputs.submission_sha256 }}
        with:
          github-token: ${{ steps.eta_mu_publish_token.outputs.token }}
          script: |
            const crypto = require('node:crypto');
            const fs = require('node:fs');
            const {
              readSubmission,
              changedLineIndex,
              validateEnvelope,
            } = require(process.env.REVIEW_PUBLISHER_FILE);
            const digest = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
            const resolvedBytes = fs.readFileSync(process.env.RESOLVED_PR_FILE);
            const submissionBytes = fs.readFileSync(process.env.REVIEW_SUBMISSION_FILE);
            if (digest(resolvedBytes) !== process.env.RESOLVED_PR_SHA256) {
              throw new Error('Trusted pull-request context digest mismatch before validation.');
            }
            if (digest(submissionBytes) !== process.env.REVIEW_SUBMISSION_SHA256) {
              throw new Error('Immutable review submission digest mismatch before validation.');
            }
            const pullRequest = JSON.parse(resolvedBytes.toString('utf8'));
            if (pullRequest.number !== Number(process.env.PR_NUMBER)
                || pullRequest.head?.sha !== process.env.PR_HEAD_SHA
                || pullRequest.merge_commit_sha !== process.env.PR_MERGE_SHA
                || pullRequest.mergeable !== true
                || pullRequest.base?.sha !== process.env.PR_BASE_SHA
                || pullRequest.base?.ref !== process.env.PR_BASE_REF
                || pullRequest.base?.ref !== process.env.PR_DEFAULT_BASE_REF
                || pullRequest.base?.repo?.default_branch !== process.env.PR_DEFAULT_BASE_REF) {
              throw new Error('Resolved pull-request context does not match the admitted review revision.');
            }
            const reviewContext = {
              ...context,
              payload: { ...context.payload, pull_request: pullRequest },
            };
            const envelope = readSubmission({ submissionFile: process.env.REVIEW_SUBMISSION_FILE });
            const changedLines = await changedLineIndex({ github, context: reviewContext });
            validateEnvelope(envelope, changedLines);
            core.info('Final review submission is schema-valid and bound to reviewable pull-request lines.');

      - name: Publish actual GitHub pull request review
        id: publish_review
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ needs.resolve_pull_request.outputs.number }}
          PR_HEAD_SHA: ${{ needs.resolve_pull_request.outputs.head_sha }}
          PR_MERGE_SHA: ${{ needs.resolve_pull_request.outputs.merge_sha }}
          PR_BASE_SHA: ${{ needs.resolve_pull_request.outputs.base_sha }}
          PR_BASE_REF: ${{ needs.resolve_pull_request.outputs.base_ref }}
          PR_DEFAULT_BASE_REF: ${{ needs.resolve_pull_request.outputs.default_base_ref }}
          REVIEW_PUBLISHER_FILE: ${{ runner.temp }}/trusted-review-context/machinery/publish-opencode-review.cjs
          REVIEW_SUBMISSION_FILE: ${{ runner.temp }}/trusted-review-submission/submission.json
          REVIEW_SUBMISSION_SHA256: ${{ needs.review.outputs.submission_sha256 }}
        with:
          github-token: ${{ steps.eta_mu_publish_token.outputs.token }}
          script: |
            const crypto = require('node:crypto');
            const fs = require('node:fs');
            const { publishReview } = require(process.env.REVIEW_PUBLISHER_FILE);
            core.setOutput('publishable', 'false');
            const submissionBytes = fs.readFileSync(process.env.REVIEW_SUBMISSION_FILE);
            const submissionDigest = crypto.createHash('sha256').update(submissionBytes).digest('hex');
            if (submissionDigest !== process.env.REVIEW_SUBMISSION_SHA256) {
              throw new Error('Immutable review submission digest mismatch before publication.');
            }
            const rawNumber = String(process.env.PR_NUMBER || '').trim();
            const admittedHeadSha = String(process.env.PR_HEAD_SHA || '').trim();
            const admittedMergeSha = String(process.env.PR_MERGE_SHA || '').trim();
            const admittedBaseSha = String(process.env.PR_BASE_SHA || '').trim();
            const admittedBaseRef = String(process.env.PR_BASE_REF || '').trim();
            const admittedDefaultBaseRef = String(process.env.PR_DEFAULT_BASE_REF || '').trim();
            if (!/^[1-9][0-9]*$/.test(rawNumber) || !Number.isSafeInteger(Number(rawNumber))) {
              throw new Error(`Publication refused: pull request number is missing or invalid: ${rawNumber || '(missing)'}.`);
            }
            if (!/^(?:[0-9a-f]{40}|[0-9a-f]{64})$/i.test(admittedHeadSha)) {
              throw new Error(`Publication refused: admitted head is missing or invalid: ${admittedHeadSha || '(missing)'}.`);
            }
            if (!/^[0-9a-f]{40}$/i.test(admittedMergeSha)) {
              throw new Error(`Publication refused: admitted merge commit is missing or invalid: ${admittedMergeSha || '(missing)'}.`);
            }
            if (!/^[0-9a-f]{40}$/i.test(admittedBaseSha)) {
              throw new Error(`Publication refused: admitted base is missing or invalid: ${admittedBaseSha || '(missing)'}.`);
            }
            if (!admittedBaseRef || !admittedDefaultBaseRef || admittedBaseRef !== admittedDefaultBaseRef) {
              throw new Error('Publication refused: admitted base is not the repository default branch.');
            }

            const { data: currentPullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: Number(rawNumber),
            });
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const targetRepository = String(currentPullRequest.base?.repo?.full_name || '');
            const headRepository = String(currentPullRequest.head?.repo?.full_name || '');
            const currentHeadSha = String(currentPullRequest.head?.sha || '');
            const currentMergeSha = String(currentPullRequest.merge_commit_sha || '');
            const currentBaseSha = String(currentPullRequest.base?.sha || '');
            const currentBaseRef = String(currentPullRequest.base?.ref || '');
            const currentDefaultBaseRef = String(currentPullRequest.base?.repo?.default_branch || '');
            const refusalReasons = [];
            if (currentPullRequest.state !== 'open') {
              refusalReasons.push(currentPullRequest.state || 'closed');
            }
            if (currentPullRequest.draft === true) refusalReasons.push('draft');
            if (targetRepository.toLowerCase() !== repository.toLowerCase()) {
              refusalReasons.push(`targets ${targetRepository || '(missing repository)'}`);
            }
            if (headRepository.toLowerCase() !== repository.toLowerCase()) {
              refusalReasons.push('fork');
            }
            if (currentHeadSha !== admittedHeadSha) {
              refusalReasons.push(`head advanced from admitted ${admittedHeadSha} to ${currentHeadSha || '(missing)'}`);
            }
            if (currentPullRequest.mergeable !== true) refusalReasons.push('not mergeable');
            if (currentMergeSha !== admittedMergeSha) {
              refusalReasons.push(`merge commit changed from admitted ${admittedMergeSha} to ${currentMergeSha || '(missing)'}`);
            }
            if (currentBaseSha !== admittedBaseSha) {
              refusalReasons.push(`base advanced from admitted ${admittedBaseSha} to ${currentBaseSha || '(missing)'}`);
            }
            if (currentBaseRef !== admittedBaseRef) {
              refusalReasons.push(`base retargeted from ${admittedBaseRef} to ${currentBaseRef || '(missing)'}`);
            }
            if (!currentDefaultBaseRef || currentBaseRef !== currentDefaultBaseRef
                || currentDefaultBaseRef !== admittedDefaultBaseRef) {
              refusalReasons.push(`base is not current repository default ${currentDefaultBaseRef || '(missing)'}`);
            }
            if (refusalReasons.length > 0) {
              throw new Error(`Publication refused: ${refusalReasons.join(', ')}.`);
            }
            const reviewContext = {
              ...context,
              payload: { ...context.payload, pull_request: currentPullRequest },
            };
            await publishReview({
              github,
              context: reviewContext,
              core,
              submissionFile: process.env.REVIEW_SUBMISSION_FILE,
            });
            core.setOutput('publishable', 'true');

      - name: Send new inline review comments to Discord
        if: ${{ success() && steps.publish_review.outputs.publishable == 'true' && env.HAS_DISCORD_REVIEW_WEBHOOK_URL == 'true' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DISCORD_REVIEW_WEBHOOK_URL: ${{ secrets.DISCORD_REVIEW_WEBHOOK_URL }}
          PR_NUMBER: ${{ needs.resolve_pull_request.outputs.number }}
          PR_HEAD_SHA: ${{ needs.resolve_pull_request.outputs.head_sha }}
          PR_BASE_SHA: ${{ needs.resolve_pull_request.outputs.base_sha }}
          PR_BASE_REF: ${{ needs.resolve_pull_request.outputs.base_ref }}
          PR_DEFAULT_BASE_REF: ${{ needs.resolve_pull_request.outputs.default_base_ref }}
          PR_MERGE_SHA: ${{ needs.resolve_pull_request.outputs.merge_sha }}
          RESOLVED_PR_FILE: ${{ runner.temp }}/trusted-resolved-pull-request/pull-request.json
          RESOLVED_PR_SHA256: ${{ needs.resolve_pull_request.outputs.context_sha256 }}
          REVIEW_STARTED_AT: ${{ needs.review.outputs.started_at }}
        with:
          github-token: ${{ steps.eta_mu_publish_token.outputs.token }}
          script: |
            const crypto = require('node:crypto');
            const fs = require('node:fs');
            const webhookUrl = process.env.DISCORD_REVIEW_WEBHOOK_URL;
            const startedAt = new Date(process.env.REVIEW_STARTED_AT || 0);
            const { owner, repo } = context.repo;
            const resolvedBytes = fs.readFileSync(process.env.RESOLVED_PR_FILE);
            const actualDigest = crypto.createHash('sha256').update(resolvedBytes).digest('hex');
            if (!/^[0-9a-f]{64}$/.test(process.env.RESOLVED_PR_SHA256 || '')
                || actualDigest !== process.env.RESOLVED_PR_SHA256) {
              throw new Error('Trusted pull-request context digest mismatch before Discord projection.');
            }
            const pr = JSON.parse(resolvedBytes.toString('utf8'));
            if (pr.number !== Number(process.env.PR_NUMBER)
                || pr.head?.sha !== process.env.PR_HEAD_SHA
                || pr.base?.sha !== process.env.PR_BASE_SHA
                || pr.base?.ref !== process.env.PR_BASE_REF
                || pr.base?.ref !== process.env.PR_DEFAULT_BASE_REF
                || pr.base?.repo?.default_branch !== process.env.PR_DEFAULT_BASE_REF
                || pr.merge_commit_sha !== process.env.PR_MERGE_SHA
                || pr.mergeable !== true) {
              throw new Error('Resolved pull-request context does not match the admitted review revision.');
            }
            if (!webhookUrl) return;

            const comments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const fresh = comments
              .filter((comment) => new Date(comment.created_at) >= startedAt)
              .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            if (fresh.length === 0) {
              core.info('No new inline review comments to send to Discord.');
              return;
            }

            const truncate = (value, max) => {
              const text = String(value || '');
              return text.length <= max ? text : `${text.slice(0, max - 1)}…`;
            };
            const embeds = fresh.map((comment) => ({
              // Discord rejects embeds whose total size exceeds 6000 chars; the
              // description cap must leave room for title, fields, and footer.
              title: truncate(`${owner}/${repo}#${pr.number}: evidence review comment`, 256),
              url: comment.html_url,
              color: 0x8b5cf6,
              description: truncate(comment.body, 1500),
              fields: [
                { name: 'Author', value: truncate(comment.user?.login || 'unknown', 100), inline: true },
                { name: 'File', value: truncate(comment.path || 'unknown', 200), inline: true },
                { name: 'Line', value: String(comment.line || comment.original_line || 'n/a'), inline: true },
                { name: 'PR', value: truncate(pr.html_url, 200), inline: false },
              ],
              timestamp: comment.created_at,
            }));

            for (let i = 0; i < embeds.length; i += 10) {
              const chunk = embeds.slice(i, i + 10);
              const response = await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({
                  username: 'MiMo Evidence Review',
                  content: `New evidence-backed review comment${chunk.length === 1 ? '' : 's'} on ${owner}/${repo}#${pr.number}`,
                  embeds: chunk,
                  allowed_mentions: { parse: [] },
                }),
              });
              if (!response.ok) {
                throw new Error(`Discord webhook failed: ${response.status} ${await response.text()}`);
              }
            }

  review_gate:
    name: OpenCode evidence review gate
    needs: [resolve_pull_request, deterministic_evidence, prepare_review_context, review, publish_review]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Enforce truthful reusable review result
        id: evaluate
        continue-on-error: true
        shell: bash
        env:
          PULL_REQUEST_CONTEXT: ${{ needs.resolve_pull_request.outputs.context_present }}
          ELIGIBLE_REVIEW_EVENT: ${{ needs.resolve_pull_request.outputs.eligible }}
          PR_BASE_SHA: ${{ needs.resolve_pull_request.outputs.base_sha }}
          PR_MERGE_SHA: ${{ needs.resolve_pull_request.outputs.merge_sha }}
          REFUSAL_REASON: ${{ needs.resolve_pull_request.outputs.refusal_reason }}
          RESOLVER_JOB_RESULT: ${{ needs.resolve_pull_request.result }}
          DETERMINISTIC_JOB_RESULT: ${{ needs.deterministic_evidence.result }}
          DETERMINISTIC_OUTPUT_RESULT: ${{ needs.deterministic_evidence.outputs.result }}
          DETERMINISTIC_EXPECTED_SHA: ${{ needs.deterministic_evidence.outputs.expected_sha }}
          DETERMINISTIC_EXECUTED_SHA: ${{ needs.deterministic_evidence.outputs.executed_sha }}
          DETERMINISTIC_COMPLETION_SHA: ${{ needs.deterministic_evidence.outputs.completion_sha }}
          DETERMINISTIC_EXACT_HEAD: ${{ needs.deterministic_evidence.outputs.exact_head }}
          DETERMINISTIC_CLEAN: ${{ needs.deterministic_evidence.outputs.clean }}
          CONTEXT_JOB_RESULT: ${{ needs.prepare_review_context.result }}
          REVIEW_JOB_RESULT: ${{ needs.review.result }}
          PUBLICATION_JOB_RESULT: ${{ needs.publish_review.result }}
          REVIEW_EXPECTED_SHA: ${{ needs.review.outputs.expected_sha }}
          REVIEW_EXECUTED_SHA: ${{ needs.review.outputs.executed_sha }}
          REVIEW_COMPLETION_SHA: ${{ needs.review.outputs.completion_sha }}
          REVIEW_EXACT_HEAD: ${{ needs.review.outputs.exact_head }}
          REVIEW_CLEAN: ${{ needs.review.outputs.clean }}
          REVIEW_PUBLICATION_ADMISSION: ${{ needs.publish_review.outputs.publication_admitted }}
        run: |
          set -euo pipefail
          node <<'NODE'
          if (process.env.PULL_REQUEST_CONTEXT !== 'true') {
            console.error('::error::OpenCode evidence review gate: pull_request_context=missing');
            process.exit(1);
          }
          if (process.env.ELIGIBLE_REVIEW_EVENT !== 'true') {
            console.error(`::error::OpenCode evidence review gate: review_dispatch_ineligible=${process.env.REFUSAL_REASON || 'unknown'}`);
            process.exit(1);
          }

          const failures = [];
          const requiredSuccess = {
            resolver_job: process.env.RESOLVER_JOB_RESULT,
            deterministic_job: process.env.DETERMINISTIC_JOB_RESULT,
            deterministic_output: process.env.DETERMINISTIC_OUTPUT_RESULT,
            context_job: process.env.CONTEXT_JOB_RESULT,
            review_job: process.env.REVIEW_JOB_RESULT,
            publication_job: process.env.PUBLICATION_JOB_RESULT,
          };
          for (const [name, value] of Object.entries(requiredSuccess)) {
            if (value !== 'success') failures.push(`${name}=${value || 'missing'}`);
          }

          const shaPattern = /^[0-9a-f]{40}$/i;
          if (!shaPattern.test(process.env.PR_BASE_SHA || '')) failures.push('base_revision_binding=invalid');
          if (!shaPattern.test(process.env.PR_MERGE_SHA || '')) failures.push('merge_revision_binding=invalid');
          const revisions = [
            ['deterministic', process.env.DETERMINISTIC_EXPECTED_SHA, process.env.DETERMINISTIC_EXECUTED_SHA, process.env.DETERMINISTIC_COMPLETION_SHA],
            ['review', process.env.REVIEW_EXPECTED_SHA, process.env.REVIEW_EXECUTED_SHA, process.env.REVIEW_COMPLETION_SHA],
          ];
          for (const [name, expected, executed, completion] of revisions) {
            if (![expected, executed, completion].every((sha) => shaPattern.test(sha || ''))
                || expected !== executed
                || expected !== completion) {
              failures.push(`${name}_revision_binding=invalid`);
            }
          }
          if (process.env.DETERMINISTIC_EXACT_HEAD !== 'true') failures.push('deterministic_exact_head=false_or_missing');
          if (process.env.DETERMINISTIC_CLEAN !== 'true') failures.push('deterministic_clean=false_or_missing');
          if (process.env.REVIEW_EXACT_HEAD !== 'true') failures.push('review_exact_head=false_or_missing');
          if (process.env.REVIEW_CLEAN !== 'true') failures.push('review_clean=false_or_missing');
          if (process.env.REVIEW_PUBLICATION_ADMISSION !== 'true') failures.push('review_publication_admission=false_or_missing');

          if (failures.length > 0) {
            for (const failure of failures) console.error(`::error::OpenCode evidence review gate: ${failure}`);
            process.exit(1);
          }
          console.log('OpenCode evidence review gate passed with successful dependencies and exact clean revision binding.');
          NODE

      - name: Finalize pull-request merge evidence check
        id: finalize_pr_merge_check
        if: ${{ always() }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CHECK_CONCLUSION: ${{ steps.evaluate.outcome == 'success' && 'success' || 'failure' }}
          CHECK_DETAILS_URL: ${{ needs.resolve_pull_request.outputs.check_details_url }}
          CHECK_EXTERNAL_ID: ${{ needs.resolve_pull_request.outputs.check_external_id }}
          CHECK_NAME: eta-mu-opencode-evidence
          CHECK_RUN_ID: ${{ needs.resolve_pull_request.outputs.check_run_id }}
          PR_HEAD_SHA: ${{ needs.resolve_pull_request.outputs.head_sha }}
          PR_BASE_SHA: ${{ needs.resolve_pull_request.outputs.base_sha }}
          PR_MERGE_SHA: ${{ needs.resolve_pull_request.outputs.merge_sha }}
          PR_NUMBER: ${{ needs.resolve_pull_request.outputs.number }}
        with:
          script: |
            const rawCheckId = String(process.env.CHECK_RUN_ID || '').trim();
            const expectedHead = String(process.env.PR_HEAD_SHA || '').trim();
            const expectedBase = String(process.env.PR_BASE_SHA || '').trim();
            const expectedMerge = String(process.env.PR_MERGE_SHA || '').trim();
            const expectedExternalId = String(process.env.CHECK_EXTERNAL_ID || '');
            const expectedDetailsUrl = String(process.env.CHECK_DETAILS_URL || '');
            const checkName = process.env.CHECK_NAME;
            if (!/^[1-9][0-9]*$/.test(rawCheckId)
                || !Number.isSafeInteger(Number(rawCheckId))
                || !/^[0-9a-f]{40}$/i.test(expectedHead)
                || !/^[0-9a-f]{40}$/i.test(expectedBase)
                || !/^[0-9a-f]{40}$/i.test(expectedMerge)) {
              throw new Error('PR-merge evidence check identity is missing or invalid.');
            }
            const externalMatch = /^eta-mu-code-review\/v2:([0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}):([1-9][0-9]*):([1-9][0-9]*):([1-9][0-9]*):([0-9a-f]{40}):([0-9a-f]{40}):([0-9a-f]{40})$/i.exec(expectedExternalId);
            if (!externalMatch || externalMatch[4] !== String(process.env.PR_NUMBER || '')
                || externalMatch[5] !== expectedHead
                || externalMatch[6] !== expectedBase
                || externalMatch[7] !== expectedMerge) {
              throw new Error('PR-merge evidence external_id is malformed or revision-unbound.');
            }
            const expectedBoundDetails = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${externalMatch[2]}/attempts/${externalMatch[3]}`;
            if (expectedDetailsUrl !== expectedBoundDetails) {
              throw new Error('PR-merge evidence details_url is not bound to external_id.');
            }

            const checkId = Number(rawCheckId);
            const sameMergeChecks = await github.paginate(github.rest.checks.listForRef, {
              ...context.repo,
              ref: expectedMerge,
              check_name: checkName,
              filter: 'all',
              per_page: 100,
            });
            const newest = sameMergeChecks
              .filter((check) => check.name === checkName
                && check.head_sha === expectedMerge
                && check.app?.slug === 'github-actions'
                && String(check.external_id || '').startsWith('eta-mu-code-review/v2:'))
              .sort((left, right) => right.id - left.id)[0];
            if (!newest || newest.id !== checkId) {
              core.info('PR-merge evidence check was superseded by a newer review command; leaving it unchanged.');
              core.setOutput('superseded', 'true');
              return;
            }

            const { data: check } = await github.rest.checks.get({
              ...context.repo,
              check_run_id: checkId,
            });
            if (check.id !== checkId
                || check.name !== checkName
                || check.head_sha !== expectedMerge
                || check.external_id !== expectedExternalId
                || check.details_url !== expectedDetailsUrl
                || check.app?.slug !== 'github-actions'
                || !['in_progress', 'completed'].includes(check.status)) {
              throw new Error('PR-merge evidence check no longer matches its trusted binding.');
            }
            const conclusion = process.env.CHECK_CONCLUSION === 'success' ? 'success' : 'failure';
            await github.rest.checks.update({
              ...context.repo,
              check_run_id: checkId,
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              output: {
                title: checkName,
                summary: conclusion === 'success'
                  ? 'Evidence-first review completed successfully for this exact pull-request merge revision.'
                  : 'Evidence-first review failed or did not prove every required head-and-merge gate.',
              },
            });
            core.setOutput('superseded', 'false');

      - name: Return pull-request evidence gate outcome
        if: ${{ always() }}
        shell: bash
        env:
          EVALUATION_OUTCOME: ${{ steps.evaluate.outcome }}
          FINALIZATION_OUTCOME: ${{ steps.finalize_pr_merge_check.outcome }}
        run: |
          if [ "$EVALUATION_OUTCOME" != "success" ] || [ "$FINALIZATION_OUTCOME" != "success" ]; then
            exit 1
          fi
