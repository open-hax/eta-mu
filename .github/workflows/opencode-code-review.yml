          dHJpbmdpZnkoYWNjZXB0ZWQpKTsKICAgIGZzLmFwcGVuZEZpbGVTeW5jKHByb2Nlc3MuZW52LkdJ
          VEhVQl9PVVRQVVQsIGByZXZpZXdfaW52b2NhdGlvbl9zaGEyNTY9JHtkaWdlc3R9XG5gKTsKICB9
          IGNhdGNoIChlcnJvcikgewogICAgbWV0YWRhdGEuYWNjZXB0ZWRfaW52b2NhdGlvbiA9IG51bGw7
          CiAgICBtZXRhZGF0YS5yZWplY3RlZF9hY2NlcHRlZF9pbnZvY2F0aW9uID0gYWNjZXB0ZWQ7CiAg
          ICBtZXRhZGF0YS5zdXBlcnZpc29yX2Vycm9yID0gZXJyb3IgaW5zdGFuY2VvZiBFcnJvciA/IGVy
          cm9yLm1lc3NhZ2UgOiBTdHJpbmcoZXJyb3IpOwogICAgd3JpdGVSZWNvdmVyeShwYXRoLmpvaW4o
          ZXZpZGVuY2VEaXJlY3RvcnksICJyZWNvdmVyeS5qc29uIiksIG1ldGFkYXRhKTsKICAgIHRocm93
          IGVycm9yOwogIH0KfQoKaWYgKHByb2Nlc3MuYXJndlsxXSAmJiBwYXRoLnJlc29sdmUocHJvY2Vz
