# SPDX-License-Identifier: GPL-3.0-or-later
name: OpenCode evidence PR review
run-name: OpenCode review PR ${{ inputs.pr_number }} (${{ inputs.command_id }})

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to resolve and review.
        required: true
        type: number
      pr_head_sha:
        description: Immutable pull-request head expected by the admitted command.
        required: true
        type: string
      pr_base_sha:
        description: Exact default-branch base commit used to synthesize the admitted merge.
        required: true
        type: string
      pr_merge_sha:
        description: Exact synthetic merge commit for the admitted head and current default base.
        required: true
        type: string
      command_id:
        description: Durable webhook delivery or command identifier.
        required: true
        type: string
  workflow_call:
    inputs:
      controller_app_login:
        description: Dedicated controller App bot login from the caller's protected repository variable.
        required: true
        type: string
      pr_number:
        description: Pull request number supplied by a workflow_dispatch wrapper.
        required: true
        type: number
      pr_head_sha:
        description: Immutable pull-request head commit to check out, execute, review, and report.
        required: true
        type: string
      pr_base_sha:
        description: Exact default-branch base commit used to synthesize the admitted merge.
        required: true
        type: string
      pr_merge_sha:
        description: Exact synthetic merge commit for the admitted head and current default base.
        required: true
        type: string
      command_id:
        description: Durable command identifier supplied by a workflow_dispatch wrapper.
        required: true
        type: string
      model:
        description: OpenCode provider/model the reviewer runs.
        required: false
        type: string
        default: opencode/mimo-v2.5-free
      opencode_version:
        description: Pinned opencode-ai npm version for the review runner.
        required: false
        type: string
        default: 1.18.18
      muse_revision:
        description: Pinned octave-commons/muse commit used to compile the review observer projection.
        required: false
        type: string
        default: 3510440a01bac8c8ecbe8d5b8d08eb4a5cd46cac
      agents_revision:
        description: Pinned riatzukiza/.agents commit mounted as global skills.
        required: false
        type: string
        default: 7fd3252e7663ad5e68be5e90429d126aa66c38c8
      setup_eta_mu_toolchain:
        description: Install Java/Clojure/pnpm/Node before gates. Callers with their own toolchain disable this and provide evidence_gates_script.
        required: false
        type: boolean
        default: true
      evidence_gates_script:
        description: Bash snippet of run_gate invocations producing deterministic evidence. Runs without secrets in the checked-out pull request. The default covers only the public webhook-controller scope; Sol and private-dependency gates remain separate native exact-head CI.
        required: false
        type: string
        default: |
          run_gate install pnpm install --frozen-lockfile --ignore-scripts
          install_status="$(awk -F= '$1 == "install" {print $2}' "$statuses")"
          if [[ "$install_status" == "0" ]]; then
            run_gate workflow_contract node --test .github/scripts/opencode-code-review-workflow.test.mjs .github/scripts/sol-ci-workflow.test.mjs
            run_gate controller_lint clj-kondo --config packages/gitops-controller/.clj-kondo/config.edn --lint packages/gitops-controller/src/cljs packages/gitops-controller/test/cljs
            run_gate controller_test_compile pnpm --dir packages/gitops-controller exec shadow-cljs compile test
            run_gate controller_test node packages/gitops-controller/target/test.cjs
            run_gate controller_build pnpm --dir packages/gitops-controller exec shadow-cljs release server
          else
            echo "workflow_contract=125" >> "$statuses"
            echo "controller_lint=125" >> "$statuses"
            echo "controller_test_compile=125" >> "$statuses"
            echo "controller_test=125" >> "$statuses"
            echo "controller_build=125" >> "$statuses"
            echo "Dependency installation failed; public webhook-controller gates were not attempted." >> "$log"
          fi
    secrets:
      ETA_MU_APP_ID:
        # Optional so evidence/compile jobs still run in organizations where the
        # app secrets are not visible; the review job then fails fast with an
        # explicit operator instruction instead of a plan-time error.
        required: false
      ETA_MU_APP_PRIVATE_KEY:
        required: false
      DISCORD_REVIEW_WEBHOOK_URL:
        required: false

concurrency:
  group: opencode-evidence-review-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  resolve_pull_request:
    name: Resolve current pull request context
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      context_present: ${{ steps.resolve.outputs.context_present }}
      eligible: ${{ steps.resolve.outputs.eligible }}
      refusal_reason: ${{ steps.resolve.outputs.refusal_reason }}
      number: ${{ steps.resolve.outputs.number }}
      requested_head_sha: ${{ steps.resolve.outputs.requested_head_sha }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      merge_sha: ${{ steps.resolve.outputs.merge_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
      default_base_ref: ${{ steps.resolve.outputs.default_base_ref }}
      html_url: ${{ steps.resolve.outputs.html_url }}
      context_sha256: ${{ steps.resolve.outputs.context_sha256 }}
      check_run_id: ${{ steps.resolve.outputs.check_run_id }}
      check_external_id: ${{ steps.resolve.outputs.check_external_id }}
      check_details_url: ${{ steps.resolve.outputs.check_details_url }}
      artifact_name: ${{ steps.resolved_context_artifact_name.outputs.name }}
    permissions:
      checks: write
      pull-requests: read
    steps:
      - name: Resolve and verify pull request context
        id: resolve
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number || '' }}
          INPUT_PR_HEAD_SHA: ${{ inputs.pr_head_sha || '' }}
          INPUT_PR_BASE_SHA: ${{ inputs.pr_base_sha || '' }}
          INPUT_PR_MERGE_SHA: ${{ inputs.pr_merge_sha || '' }}
          COMMAND_ID: ${{ inputs.command_id || '' }}
          EXPECTED_CONTROLLER_APP_LOGIN: ${{ inputs.controller_app_login || vars.ETA_MU_CONTROLLER_APP_LOGIN }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RESOLVED_PR_DIRECTORY: ${{ runner.temp }}/resolved-pull-request
          EVIDENCE_CHECK_NAME: eta-mu-opencode-evidence
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_SERVER_URL_VALUE: ${{ github.server_url }}
        with:
          script: |
            const crypto = require('node:crypto');
            const fs = require('node:fs');
            const path = require('node:path');
            if (context.eventName !== 'workflow_dispatch') {
              throw new Error(`Review execution requires a trusted workflow_dispatch command; received ${context.eventName || '(missing)'}.`);
            }
            const expectedControllerActor = String(process.env.EXPECTED_CONTROLLER_APP_LOGIN || '');
            if (!/^[A-Za-z0-9][A-Za-z0-9-]{0,99}\[bot\]$/.test(expectedControllerActor)) {
              throw new Error('ETA_MU_CONTROLLER_APP_LOGIN repository variable is missing or invalid.');
            }
            if (context.actor !== expectedControllerActor) {
              throw new Error(`Review execution requires the configured eta-mu controller App actor; received ${context.actor || '(missing)'}.`);
            }
            if (process.env.TRIGGERING_ACTOR !== expectedControllerActor) {
              throw new Error(`Review execution requires the configured eta-mu controller App triggering actor; received ${process.env.TRIGGERING_ACTOR || '(missing)'}.`);
            }
            const rawNumber = String(process.env.INPUT_PR_NUMBER || '').trim();
            if (!/^[1-9][0-9]*$/.test(rawNumber) || !Number.isSafeInteger(Number(rawNumber))) {
              throw new Error(`Pull request number is missing or invalid: ${rawNumber || '(missing)'}`);
            }
            const pullNumber = Number(rawNumber);

            const requestedHeadSha = String(process.env.INPUT_PR_HEAD_SHA || '').trim();
            if (!/^(?:[0-9a-f]{40}|[0-9a-f]{64})$/i.test(requestedHeadSha)) {
              throw new Error(`Pull request head is missing or is not an immutable commit: ${requestedHeadSha || '(missing)'}`);
            }
            const requestedMergeSha = String(process.env.INPUT_PR_MERGE_SHA || '').trim();
            if (!/^[0-9a-f]{40}$/i.test(requestedMergeSha)) {
              throw new Error(`Pull request merge commit is missing or invalid: ${requestedMergeSha || '(missing)'}`);
            }
            const requestedBaseSha = String(process.env.INPUT_PR_BASE_SHA || '').trim();
            if (!/^[0-9a-f]{40}$/i.test(requestedBaseSha)) {
              throw new Error(`Pull request base commit is missing or invalid: ${requestedBaseSha || '(missing)'}`);
            }
            if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(process.env.COMMAND_ID || '')) {
              throw new Error('workflow_dispatch command_id is missing or invalid.');
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            });
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const targetRepository = String(pullRequest.base?.repo?.full_name || '');
            const defaultBaseRef = String(pullRequest.base?.repo?.default_branch || '');
            if (targetRepository.toLowerCase() !== repository.toLowerCase()) {
              throw new Error(`Resolved pull request targets ${targetRepository || '(missing)'}, expected ${repository}.`);
            }
            const currentHeadSha = String(pullRequest.head?.sha || '');
            if (requestedHeadSha !== currentHeadSha) {
              throw new Error(`Requested head ${requestedHeadSha} does not match current head ${currentHeadSha || '(missing)'}.`);
            }
            const currentBaseSha = String(pullRequest.base?.sha || '');
            if (requestedBaseSha !== currentBaseSha) {
              throw new Error(`Requested base commit ${requestedBaseSha} does not match current base commit ${currentBaseSha || '(missing)'}.`);
            }
            const currentMergeSha = String(pullRequest.merge_commit_sha || '');
            if (requestedMergeSha !== currentMergeSha) {
              throw new Error(`Requested merge commit ${requestedMergeSha} does not match current merge commit ${currentMergeSha || '(missing)'}.`);
            }

            const headRepository = String(pullRequest.head?.repo?.full_name || '');
            const refusalReasons = [];
            if (pullRequest.state !== 'open') refusalReasons.push(pullRequest.state || 'closed');
            if (pullRequest.draft === true) refusalReasons.push('draft');
            if (headRepository.toLowerCase() !== repository.toLowerCase()) refusalReasons.push('fork');
            if (!defaultBaseRef || pullRequest.base?.ref !== defaultBaseRef) {
              refusalReasons.push(`base is not repository default ${defaultBaseRef || '(missing)'}`);
            }
            if (pullRequest.mergeable !== true) refusalReasons.push('not mergeable');
            const eligible = refusalReasons.length === 0;
            if (!eligible) {
              throw new Error(`Dispatch refused: ${refusalReasons.join(', ')} pull request.`);
            }

            core.setOutput('context_present', 'true');
            core.setOutput('eligible', String(eligible));
            core.setOutput('refusal_reason', eligible ? 'none' : refusalReasons.join(','));
            core.setOutput('number', String(pullRequest.number));
            core.setOutput('requested_head_sha', requestedHeadSha);
            core.setOutput('head_sha', currentHeadSha);
            core.setOutput('merge_sha', currentMergeSha);
            core.setOutput('base_sha', currentBaseSha);
            core.setOutput('base_ref', String(pullRequest.base?.ref || ''));
            core.setOutput('default_base_ref', defaultBaseRef);
            core.setOutput('html_url', String(pullRequest.html_url || ''));

            const normalized = {
              number: pullRequest.number,
              title: pullRequest.title,
              body: pullRequest.body,
              html_url: pullRequest.html_url,
              state: pullRequest.state,
              draft: pullRequest.draft,
              mergeable: pullRequest.mergeable,
              merge_commit_sha: currentMergeSha,
              user: { login: pullRequest.user?.login || null },
              head: {
                ref: pullRequest.head?.ref || null,
                sha: currentHeadSha,
                repo: { full_name: headRepository || null },
              },
              base: {
                ref: pullRequest.base?.ref || null,
                sha: currentBaseSha,
                repo: {
                  full_name: targetRepository || null,
                  default_branch: defaultBaseRef || null,
                },
              },
            };
            const normalizedBytes = Buffer.from(`${JSON.stringify(normalized, null, 2)}\n`);
            fs.rmSync(process.env.RESOLVED_PR_DIRECTORY, { recursive: true, force: true });
            fs.mkdirSync(process.env.RESOLVED_PR_DIRECTORY, { recursive: true });
            fs.writeFileSync(
              path.join(process.env.RESOLVED_PR_DIRECTORY, 'pull-request.json'),
              normalizedBytes,
            );
            core.setOutput(
              'context_sha256',
              crypto.createHash('sha256').update(normalizedBytes).digest('hex'),
            );

            const runId = String(process.env.GITHUB_RUN_ID_VALUE || '').trim();
            const runAttempt = String(process.env.GITHUB_RUN_ATTEMPT_VALUE || '').trim();
            if (!/^[1-9][0-9]*$/.test(runId) || !/^[1-9][0-9]*$/.test(runAttempt)) {
              throw new Error('GitHub workflow run identity is missing or invalid.');
            }
            const checkName = process.env.EVIDENCE_CHECK_NAME;
            const checkExternalId = [
              'eta-mu-code-review/v2',
              process.env.COMMAND_ID,
              runId,
              runAttempt,
              rawNumber,
              requestedHeadSha,
              requestedBaseSha,
              requestedMergeSha,
            ].join(':');
            const checkDetailsUrl = `${process.env.GITHUB_SERVER_URL_VALUE}/${repository}/actions/runs/${runId}/attempts/${runAttempt}`;
            const { data: createdCheck } = await github.rest.checks.create({
              ...context.repo,
              name: checkName,
              head_sha: requestedMergeSha,
              status: 'in_progress',
              started_at: new Date().toISOString(),
              external_id: checkExternalId,
              details_url: checkDetailsUrl,
              output: {
                title: checkName,
                summary: `Evidence-first review is running for pull request #${rawNumber}.`,
              },
            });
            if (!Number.isSafeInteger(createdCheck.id) || createdCheck.id <= 0
                || createdCheck.name !== checkName
                || createdCheck.head_sha !== requestedMergeSha
                || createdCheck.external_id !== checkExternalId
                || createdCheck.details_url !== checkDetailsUrl
                || createdCheck.status !== 'in_progress'
                || createdCheck.app?.slug !== 'github-actions') {
              throw new Error('GitHub returned an invalid PR-merge evidence check binding.');
            }
            core.setOutput('check_run_id', String(createdCheck.id));
            core.setOutput('check_external_id', checkExternalId);
            core.setOutput('check_details_url', checkDetailsUrl);

            const sameMergeChecks = await github.paginate(github.rest.checks.listForRef, {
              ...context.repo,
              ref: requestedMergeSha,
              check_name: checkName,
              filter: 'all',
              per_page: 100,
            });
            const superseded = sameMergeChecks
              .filter((check) => check.id !== createdCheck.id
                && check.id < createdCheck.id
                && check.name === checkName
                && check.head_sha === requestedMergeSha
                && check.status !== 'completed'
                && check.app?.slug === 'github-actions'
                && String(check.external_id || '').startsWith('eta-mu-code-review/v2:'))
              .sort((left, right) => right.id - left.id);
            for (const check of superseded) {
              await github.rest.checks.update({
                ...context.repo,
                check_run_id: check.id,
                status: 'completed',
                conclusion: 'cancelled',
                completed_at: new Date().toISOString(),
                output: {
                  title: checkName,
                  summary: `Superseded by review command ${process.env.COMMAND_ID}.`,
                },
              });
            }

      - name: Bind resolved pull request artifact name
        id: resolved_context_artifact_name
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: printf 'name=resolved-pull-request-%s-%s\n' "$RUN_ID" "$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload resolved pull request context
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.resolved_context_artifact_name.outputs.name }}
          path: ${{ runner.temp }}/resolved-pull-request/pull-request.json
          if-no-files-found: error
          retention-days: 14

  deterministic_evidence:
    name: Produce deterministic review evidence
    needs: resolve_pull_request
    if: ${{ needs.resolve_pull_request.outputs.eligible == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      result: ${{ steps.gates.outputs.result }}
      expected_sha: ${{ steps.gates.outputs.expected_sha }}
      executed_sha: ${{ steps.gates.outputs.executed_sha }}
      completion_sha: ${{ steps.gates.outputs.completion_sha }}
      exact_head: ${{ steps.gates.outputs.exact_head }}
      clean: ${{ steps.gates.outputs.clean }}
      artifact_name: ${{ steps.deterministic_artifact_name.outputs.name }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve_pull_request.outputs.requested_head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact and clean pull request checkout
        id: checkout_guard
        continue-on-error: true
        shell: bash
        env:
          EVENT_PR_HEAD_SHA: ${{ needs.resolve_pull_request.outputs.head_sha }}
          PR_HEAD_SHA: ${{ needs.resolve_pull_request.outputs.requested_head_sha }}
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/opencode-deterministic-evidence
        run: |
          set -euo pipefail
          evidence_dir="$EVIDENCE_DIRECTORY"
          rm -rf "$evidence_dir"
          install -d -m 0700 "$evidence_dir"

          event_head_sha="$EVENT_PR_HEAD_SHA"
          expected_sha="$PR_HEAD_SHA"
          executed_sha="$(git rev-parse HEAD)"
          checkout_status="$(git status --porcelain --untracked-files=all)"
          expected_commit=false
          event_head_matches=false
          exact_head=false
          clean=false
          if [[ "$expected_sha" =~ ^[0-9a-f]{40}$ || "$expected_sha" =~ ^[0-9a-f]{64}$ ]]; then
            git cat-file -e "${expected_sha}^{commit}" 2>/dev/null && expected_commit=true
          fi
          if [[ "$event_head_sha" =~ ^[0-9a-f]{40}$ || "$event_head_sha" =~ ^[0-9a-f]{64}$ ]]; then
            [[ "$expected_sha" == "$event_head_sha" ]] && event_head_matches=true
          fi
          [[ "$expected_commit" == true && "$event_head_matches" == true && "$executed_sha" == "$expected_sha" ]] && exact_head=true
          [[ -z "$checkout_status" ]] && clean=true

          {
            echo "event_head_sha=$event_head_sha"
            echo "expected_sha=$expected_sha"
            echo "executed_sha=$executed_sha"
            echo "expected_commit=$expected_commit"
            echo "event_head_matches=$event_head_matches"
            echo "exact_head=$exact_head"
            echo "clean=$clean"
          } >> "$GITHUB_OUTPUT"

          printf '%s\n' "$checkout_status" > "$evidence_dir/checkout-status.txt"
          jq -n \
            --arg event_head_sha "$event_head_sha" \
            --arg expected_sha "$expected_sha" \
            --arg executed_sha "$executed_sha" \
            --argjson expected_commit "$expected_commit" \
            --argjson event_head_matches "$event_head_matches" \
            --argjson exact_head "$exact_head" \
            --argjson clean "$clean" \
            '{event_head_sha: $event_head_sha, expected_sha: $expected_sha, executed_sha: $executed_sha, expected_commit: $expected_commit, event_head_matches: $event_head_matches, exact_head: $exact_head, clean: $clean}' \
            > "$evidence_dir/checkout.json"

          if [[ "$expected_commit" != true ]]; then
            echo "::error::Expected pull-request revision is not an available immutable commit: $expected_sha"
            exit 1
          fi
          if [[ "$event_head_matches" != true ]]; then
            echo "::error::Caller-selected pull-request head $expected_sha does not match event head $event_head_sha."
            exit 1
          fi
          if [[ "$exact_head" != true ]]; then
            echo "::error::Expected pull-request head $expected_sha but checkout executed $executed_sha."
            exit 1
          fi
          if [[ "$clean" != true ]]; then
            echo "::error::Pull-request checkout was dirty before deterministic execution."
            printf '%s\n' "$checkout_status"
            exit 1
          fi

      - name: Set up Java 21
        if: ${{ !contains(toJSON(inputs), '"setup_eta_mu_toolchain"') || inputs.setup_eta_mu_toolchain }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Clojure CLI 1.12.5.1654
        if: ${{ !contains(toJSON(inputs), '"setup_eta_mu_toolchain"') || inputs.setup_eta_mu_toolchain }}
        uses: DeLaGuardo/setup-clojure@ada62bb3282a01a296659d48378b812b8e097360 # 13.4
        with:
          cli: 1.12.5.1654
          bb: "1.13.219"
          clj-kondo: "2025.10.23"

      - name: Set up pnpm 10.14.0
        if: ${{ !contains(toJSON(inputs), '"setup_eta_mu_toolchain"') || inputs.setup_eta_mu_toolchain }}
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.14.0"
          run_install: false

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Prepare trusted resolved context directory
        if: ${{ steps.checkout_guard.outputs.exact_head == 'true' && steps.checkout_guard.outputs.clean == 'true' }}
        shell: bash
        env:
          RESOLVED_CONTEXT_DIRECTORY: ${{ runner.temp }}/trusted-resolved-pull-request
        run: |
          set -euo pipefail
          rm -rf "$RESOLVED_CONTEXT_DIRECTORY"
          install -d -m 0700 "$RESOLVED_CONTEXT_DIRECTORY"

      - name: Download resolved pull request context
        if: ${{ steps.checkout_guard.outputs.exact_head == 'true' && steps.checkout_guard.outputs.clean == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.resolve_pull_request.outputs.artifact_name }}
          path: ${{ runner.temp }}/trusted-resolved-pull-request

      - name: Stage pull request diff and context
        if: ${{ steps.checkout_guard.outputs.exact_head == 'true' && steps.checkout_guard.outputs.clean == 'true' }}
        shell: bash
        env:
          PR_BASE_SHA: ${{ needs.resolve_pull_request.outputs.base_sha }}
          RESOLVED_PR_SHA256: ${{ needs.resolve_pull_request.outputs.context_sha256 }}
          RESOLVED_CONTEXT_DIRECTORY: ${{ runner.temp }}/trusted-resolved-pull-request
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/opencode-deterministic-evidence
        run: |
          set -euo pipefail
          evidence_dir="$EVIDENCE_DIRECTORY"
          resolved_file="$RESOLVED_CONTEXT_DIRECTORY/pull-request.json"

          mapfile -t resolved_entries < <(find "$RESOLVED_CONTEXT_DIRECTORY" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          if [[ "${#resolved_entries[@]}" -ne 1 || "${resolved_entries[0]}" != pull-request.json ]]; then
            echo "::error::Resolved pull-request artifact has unexpected entries." >&2
            exit 1
          fi
          test -f "$resolved_file"
          test ! -L "$resolved_file"

          expected_digest="$RESOLVED_PR_SHA256"
          actual_digest="$(sha256sum "$resolved_file" | awk '{print $1}')"
          if [[ ! "$expected_digest" =~ ^[0-9a-f]{64}$ || "$actual_digest" != "$expected_digest" ]]; then
            echo "::error::Resolved pull-request context digest mismatch before deterministic staging." >&2
            exit 1
          fi
          cp --no-preserve=mode,ownership "$resolved_file" "$evidence_dir/pull-request.json"

          git diff --find-renames "${PR_BASE_SHA}...HEAD" > "$evidence_dir/pr.diff" || true
          if [[ ! -s "$evidence_dir/pr.diff" ]]; then
            git diff --find-renames "${PR_BASE_SHA}" HEAD > "$evidence_dir/pr.diff"
          fi
          bytes="$(wc -c < "$evidence_dir/pr.diff")"
          if [[ "$bytes" -gt 300000 ]]; then
            head -c 300000 "$evidence_dir/pr.diff" > "$evidence_dir/pr.diff.truncated"
            mv "$evidence_dir/pr.diff.truncated" "$evidence_dir/pr.diff"
            printf '\n[eta-mu review] diff truncated at 300000 bytes (was %s).\n' "$bytes" >> "$evidence_dir/pr.diff"
          fi

          jq -r '
            "# Pull request context",
            "",
            "- Number: #\(.number)",
            "- Title: \(.title)",
            "- Author: \(.user.login)",
            "- Branches: \(.head.ref) -> \(.base.ref)",
            "- Head SHA: \(.head.sha)",
            "- Merge SHA: \(.merge_commit_sha)",
            "- Draft: \(.draft)",
            "",
            "## Body",
            "",
            (.body // "(no body)")
          ' "$evidence_dir/pull-request.json" > "$evidence_dir/pr-context.md"

      - name: Run deterministic gates
        id: gate_commands
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          PR_BASE_SHA: ${{ needs.resolve_pull_request.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.resolve_pull_request.outputs.requested_head_sha }}
          PR_MERGE_SHA: ${{ needs.resolve_pull_request.outputs.merge_sha }}
          PR_NUMBER: ${{ needs.resolve_pull_request.outputs.number }}
          EVIDENCE_GATES_SCRIPT: ${{ inputs.evidence_gates_script || '' }}
          CHECKOUT_EXACT_HEAD: ${{ steps.checkout_guard.outputs.exact_head }}
          CHECKOUT_CLEAN: ${{ steps.checkout_guard.outputs.clean }}
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/opencode-deterministic-evidence
        run: |
          set +e
          evidence_dir="$EVIDENCE_DIRECTORY"
          log="$evidence_dir/deterministic.log"
          statuses="$evidence_dir/statuses.env"
          mkdir -p "$evidence_dir"
          : > "$log"
          : > "$statuses"

          run_gate() {
            local name="$1"
            shift
            {
              echo
              echo "===== ${name} ====="
              printf 'command:'
              printf ' %q' "$@"
              echo
            } >> "$log"
            "$@" >> "$log" 2>&1
            local code=$?
            echo "${name}=${code}" >> "$statuses"
            echo "${name}: exit ${code}" | tee -a "$log"
            return 0
          }

          run_gate_preserving_generated_outputs() {
            local name="$1"
            shift
            local baseline_dir="$RUNNER_TEMP/opencode-generated-output-baseline"
            local generated_dir="$evidence_dir/generated"
            local baseline_clean=true
            local generated_paths=(
              "packages/legacy/ai/src/models.generated.ts"
              "packages/contracts/output/dist-cli/index.cjs"
              "packages/contracts/output/dist-cli/index.cjs.map"
            )
            local generated_path snapshot_path artifact_path

            mkdir -p "$baseline_dir"
            for generated_path in "${generated_paths[@]}"; do
              snapshot_path="$baseline_dir/$generated_path"
              if [[ -f "$generated_path" ]] && git diff --quiet HEAD -- "$generated_path"; then
                mkdir -p "$(dirname "$snapshot_path")"
                cp "$generated_path" "$snapshot_path"
              else
                baseline_clean=false
                echo "Generated output was missing or dirty before the build gate: $generated_path" >> "$log"
              fi
            done
            if [[ "$baseline_clean" == true ]]; then
              echo "generated_outputs_baseline=0" >> "$statuses"
            else
              echo "generated_outputs_baseline=1" >> "$statuses"
            fi

            run_gate "$name" "$@"

            if [[ "$baseline_clean" == true ]]; then
              for generated_path in "${generated_paths[@]}"; do
                snapshot_path="$baseline_dir/$generated_path"
                artifact_path="$generated_dir/$generated_path"
                if [[ ! -f "$generated_path" ]] || ! cmp -s "$snapshot_path" "$generated_path"; then
                  mkdir -p "$(dirname "$artifact_path")"
                  if [[ -f "$generated_path" ]]; then
                    cp "$generated_path" "$artifact_path"
                    sha256sum "$artifact_path" > "${artifact_path}.sha256"
                  else
                    printf '%s\n' "build removed $generated_path" > "${artifact_path}.missing"
                  fi
                fi
              done

              for generated_path in "${generated_paths[@]}"; do
                snapshot_path="$baseline_dir/$generated_path"
                mkdir -p "$(dirname "$generated_path")"
                cp "$snapshot_path" "$generated_path"
              done
              if git diff --quiet HEAD -- "${generated_paths[@]}"; then
                echo "generated_outputs_restore=0" >> "$statuses"
              else
                echo "generated_outputs_restore=1" >> "$statuses"
                echo "Explicit generated outputs could not be restored to the checked-out revision." >> "$log"
              fi
            else
              echo "generated_outputs_restore=125" >> "$statuses"
            fi
          }

          if [[ "$CHECKOUT_EXACT_HEAD" != "true" || "$CHECKOUT_CLEAN" != "true" ]]; then
            echo "checkout_guard=1" >> "$statuses"
            echo "Deterministic commands were not executed because the checkout was not the exact clean pull-request head." >> "$log"
          elif [[ -n "${EVIDENCE_GATES_SCRIPT//[[:space:]]/}" ]]; then
            eval "$EVIDENCE_GATES_SCRIPT"
          else
            run_gate install pnpm install --frozen-lockfile --ignore-scripts
            install_status="$(awk -F= '$1 == "install" {print $2}' "$statuses")"
            if [[ "$install_status" == "0" ]]; then
              run_gate workflow_contract node --test .github/scripts/opencode-code-review-workflow.test.mjs .github/scripts/sol-ci-workflow.test.mjs
              run_gate controller_lint clj-kondo --config packages/gitops-controller/.clj-kondo/config.edn --lint packages/gitops-controller/src/cljs packages/gitops-controller/test/cljs
              run_gate controller_test_compile pnpm --dir packages/gitops-controller exec shadow-cljs compile test
              run_gate controller_test node packages/gitops-controller/target/test.cjs
              run_gate controller_build pnpm --dir packages/gitops-controller exec shadow-cljs release server
            else
              {
                echo "workflow_contract=125"
                echo "controller_lint=125"
                echo "controller_test_compile=125"
                echo "controller_test=125"
                echo "controller_build=125"
              } >> "$statuses"
              echo "Dependency installation failed; public webhook-controller gates were not attempted." >> "$log"
            fi
          fi

      - name: Summarize deterministic evidence
        id: gates
        if: ${{ always() }}
        shell: bash
        env:
          PR_BASE_SHA: ${{ needs.resolve_pull_request.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.resolve_pull_request.outputs.requested_head_sha }}
          PR_MERGE_SHA: ${{ needs.resolve_pull_request.outputs.merge_sha }}
          PR_NUMBER: ${{ needs.resolve_pull_request.outputs.number }}
          CHECKOUT_EXPECTED_SHA: ${{ steps.checkout_guard.outputs.expected_sha }}
          CHECKOUT_EXECUTED_SHA: ${{ steps.checkout_guard.outputs.executed_sha }}
          CHECKOUT_EXACT_HEAD: ${{ steps.checkout_guard.outputs.exact_head }}
          CHECKOUT_CLEAN: ${{ steps.checkout_guard.outputs.clean }}
          GATE_STEP_OUTCOME: ${{ steps.gate_commands.outcome }}
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/opencode-deterministic-evidence
        run: |
          set -euo pipefail
          evidence_dir="$EVIDENCE_DIRECTORY"
          mkdir -p "$evidence_dir"
          completion_sha="$(git rev-parse HEAD 2>/dev/null || true)"
          completion_status="$(git status --porcelain --untracked-files=all)"
          completion_clean=false
          [[ -z "$completion_status" ]] && completion_clean=true
          printf '%s\n' "$completion_status" > "$evidence_dir/completion-status.txt"
          export COMPLETION_SHA="$completion_sha"
          export COMPLETION_CLEAN="$completion_clean"

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const evidenceDir = process.env.EVIDENCE_DIRECTORY;
          const statusesPath = path.join(evidenceDir, 'statuses.env');
          const errors = [];
          const statuses = {};
          if (!fs.existsSync(statusesPath)) {
            errors.push('deterministic statuses.env is missing');
          } else {
            for (const line of fs.readFileSync(statusesPath, 'utf8').trim().split(/\n+/).filter(Boolean)) {
              const match = /^([A-Za-z0-9_.-]+)=([0-9]+)$/.exec(line);
              if (!match) {
                errors.push(`malformed deterministic status: ${line}`);
                continue;
              }
              const [, name, rawCode] = match;
              if (Object.hasOwn(statuses, name)) {
                errors.push(`duplicate deterministic status: ${name}`);
                continue;
              }
              statuses[name] = Number(rawCode);
            }
          }
          if (Object.keys(statuses).length === 0) {
            errors.push('no deterministic gate statuses were recorded');
          }
          const attempted = Object.fromEntries(
            Object.entries(statuses).map(([name, code]) => [name, code !== 125]),
          );
          const shaPattern = /^[0-9a-f]{40}$/i;
          const expectedHeadSha = process.env.CHECKOUT_EXPECTED_SHA || process.env.PR_HEAD_SHA || '';
          const mergeSha = process.env.PR_MERGE_SHA || '';
          const executedSha = process.env.CHECKOUT_EXECUTED_SHA || '';
          const completionSha = process.env.COMPLETION_SHA || '';
          const exactHead = shaPattern.test(expectedHeadSha)
            && shaPattern.test(executedSha)
            && shaPattern.test(completionSha)
            && expectedHeadSha === executedSha
            && expectedHeadSha === completionSha
            && process.env.CHECKOUT_EXACT_HEAD === 'true';
          const clean = process.env.CHECKOUT_CLEAN === 'true' && process.env.COMPLETION_CLEAN === 'true';
          if (!exactHead) errors.push('expected, executed, and completion revisions are not one exact pull-request head');
          if (!shaPattern.test(mergeSha)) errors.push('admitted synthetic merge revision is missing or invalid');
          if (!clean) errors.push('checkout was not clean across deterministic execution');
          if (process.env.GATE_STEP_OUTCOME !== 'success') {
            errors.push(`deterministic command step outcome was ${process.env.GATE_STEP_OUTCOME || 'missing'}`);
          }
          const result = errors.length === 0 && Object.values(statuses).every((code) => code === 0)
            ? 'success'
            : 'failure';
          const summary = {
            schema: 'open-hax.review-evidence/v2',
            repository: process.env.GITHUB_REPOSITORY,
            pull_request: Number(process.env.PR_NUMBER),
            base_sha: process.env.PR_BASE_SHA,
            merge_sha: mergeSha || null,
            expected_head_sha: expectedHeadSha,
            executed_sha: executedSha || null,
            completion_sha: completionSha || null,
            head_sha: exactHead ? executedSha : null,
            exact_head: exactHead,
            clean_checkout: clean,
            generated_at: new Date().toISOString(),
            result,
            statuses,
            attempted,
            errors,
            interpretation: 'Exit 125 means the gate was skipped because a required prerequisite failed.',
          };
          fs.writeFileSync(path.join(evidenceDir, 'summary.json'), `${JSON.stringify(summary, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `result=${result}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `expected_sha=${expectedHeadSha}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `executed_sha=${executedSha}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `completion_sha=${completionSha}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `exact_head=${exactHead}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `clean=${clean}\n`);
          NODE

      - name: Seal deterministic evidence manifest
        if: always()
        shell: bash
        env:
          EVIDENCE_DIRECTORY: ${{ runner.temp }}/opencode-deterministic-evidence
        run: |
          set -euo pipefail
          evidence_dir="$EVIDENCE_DIRECTORY"
          test -d "$evidence_dir"
          test ! -L "$evidence_dir"
          if find "$evidence_dir" -type l -print -quit | grep -q .; then
            echo "::error::Deterministic evidence contains a symbolic link." >&2
            exit 1
          fi
          rm -f "$evidence_dir/SHA256SUMS"
          manifest="$RUNNER_TEMP/opencode-deterministic-evidence.SHA256SUMS"
          (cd "$evidence_dir" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum) > "$manifest"
          mv "$manifest" "$evidence_dir/SHA256SUMS"

      - name: Bind deterministic artifact name
        id: deterministic_artifact_name
        if: always()
        shell: bash
        env:
          PR_NUMBER: ${{ needs.resolve_pull_request.outputs.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: printf 'name=review-evidence-%s-%s-%s\n' "$PR_NUMBER" "$RUN_ID" "$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload deterministic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.deterministic_artifact_name.outputs.name }}
          path: ${{ runner.temp }}/opencode-deterministic-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  prepare_review_context:
    name: Compile Muse tools and stage skills
    needs: resolve_pull_request
    if: ${{ needs.resolve_pull_request.outputs.eligible == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.context_artifact_name.outputs.name }}
    permissions:
      contents: read
    steps:
      - name: Validate immutable review tool revisions
        shell: bash
        env:
          MUSE_REVISION: ${{ inputs.muse_revision || '3510440a01bac8c8ecbe8d5b8d08eb4a5cd46cac' }}
          AGENTS_REVISION: ${{ inputs.agents_revision || '7fd3252e7663ad5e68be5e90429d126aa66c38c8' }}
        run: |
          set -euo pipefail
          for revision in "$MUSE_REVISION" "$AGENTS_REVISION"; do
            if [[ ! "$revision" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
              echo "::error::Review tool revisions must be immutable hexadecimal commit IDs." >&2
              exit 1
            fi
          done

      - name: Checkout Muse compatibility compiler
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: octave-commons/muse
          ref: ${{ inputs.muse_revision || '3510440a01bac8c8ecbe8d5b8d08eb4a5cd46cac' }}
          path: .review-context/muse
          persist-credentials: false

      - name: Checkout global agent skills
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: riatzukiza/.agents
          ref: ${{ inputs.agents_revision || '7fd3252e7663ad5e68be5e90429d126aa66c38c8' }}
          path: .review-context/agents
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Clojure CLI 1.12.5.1654
        uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          cli: 1.12.5.1654

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .review-context/muse/package-lock.json

      - name: Compile and verify a read-only Muse review profile
        working-directory: .review-context/muse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ημ/config/opencode/plugins .ημ/config/opencode/permissions

          cat > .ημ/config/opencode/plugins/review-observers.edn <<'EOF'
          {:resource plugins.actors/plugin
           :expose   [:muse/phases
                      :phase/list_active
                      :phase/list_idle
                      :phase/tail
                      :phase/head
                      :phase/filter
                      :phase/observations
                      :phase/conclusions
                      :actor/list
                      :actor/mailbox
                      :actor/monitor
                      :task/status
                      :task/list
                      :agent/list]}
          EOF

          cat > .ημ/config/opencode/permissions/review-observers.edn <<'EOF'
          {:permissions
           [{:id :review/allow-observers
             :applies #{:muse_phases
                        :phase_list_active
                        :phase_list_idle
                        :phase_tail
                        :phase_head
                        :phase_filter
                        :phase_observations
                        :phase_conclusions
                        :actor_list
                        :actor_mailbox
                        :actor_monitor
                        :task_status
                        :task_list
                        :agent_list}
             :policy :allow}
            {:id :review/allow-review-pipeline
             :applies #{:review_begin
                        :review_record_evidence
                        :review_propose_finding
                        :review_classify_finding
                        :review_status
                        :review_submit}
             :policy :allow}]}
          EOF

          cat > .ημ/config/opencode/root.edn <<'EOF'
          {:eta-mu/opencode-version 1
           :id                     :eta-mu/review-observers
           :imports
           ["../shared/profiles.edn"
            "../shared/plugins/review-pipeline.edn"
            "plugins/review-observers.edn"
            "permissions/review-observers.edn"]
           :profile :dev
           :build ["shadow-cljs" "release" "opencode-plugin"]}
          EOF

          npm ci --ignore-scripts --no-audit --no-fund
          clojure -M -e "(require 'eta-mu.opencode.build) (eta-mu.opencode.build/generate-entrypoint {})"
          test -s src/gen/eta_mu/gen/opencode_plugin.cljs
          npx shadow-cljs release opencode-plugin

          test -s .opencode/dist/eta-mu-actors.js
          test -s .opencode/plugins/eta-mu-actors.js
          test -s .opencode/opencode.json
          test -s .opencode/package.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { EtaMuActorsPlugin } from './.opencode/dist/eta-mu-actors.js';

          const expected = [
            'actor_list',
            'actor_mailbox',
            'actor_monitor',
            'agent_list',
            'muse_phases',
            'phase_conclusions',
            'phase_filter',
            'phase_head',
            'phase_list_active',
            'phase_list_idle',
            'phase_observations',
            'phase_tail',
            'review_begin',
            'review_classify_finding',
            'review_propose_finding',
            'review_record_evidence',
            'review_status',
            'review_submit',
            'task_list',
            'task_status',
          ].sort();

          const config = JSON.parse(fs.readFileSync('.opencode/opencode.json', 'utf8'));
          const permissionNames = Object.keys(config.permission ?? {}).sort();
          if (JSON.stringify(permissionNames) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected permission registry: ${JSON.stringify(permissionNames)}`);
          }
          for (const name of permissionNames) {
            if (config.permission[name] !== 'allow') {
              throw new Error(`Observer permission is not allow: ${name}`);
            }
          }

          const plugin = await EtaMuActorsPlugin({});
          const runtimeNames = Object.keys(plugin.tool ?? {}).sort();
          if (JSON.stringify(runtimeNames) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected runtime tool registry: ${JSON.stringify(runtimeNames)}`);
          }
          fs.writeFileSync('.opencode/exposed-tools.txt', `${runtimeNames.join('\n')}\n`);
          NODE

      - name: Assemble revision-bound review context
        shell: bash
        env:
          MUSE_REVISION: ${{ inputs.muse_revision || '3510440a01bac8c8ecbe8d5b8d08eb4a5cd46cac' }}
          AGENTS_REVISION: ${{ inputs.agents_revision || '7fd3252e7663ad5e68be5e90429d126aa66c38c8' }}
        run: |
          set -euo pipefail
          CONTEXT_OUT="$RUNNER_TEMP/opencode-review-context"
          rm -rf "$CONTEXT_OUT"
          mkdir -p "$CONTEXT_OUT/muse/opencode" "$CONTEXT_OUT/agents" "$CONTEXT_OUT/metadata" \
            "$CONTEXT_OUT/machinery"

          cp -a .review-context/muse/.opencode/dist "$CONTEXT_OUT/muse/opencode/"
          cp -a .review-context/muse/.opencode/plugins "$CONTEXT_OUT/muse/opencode/"
          cp -a .review-context/muse/.opencode/agents "$CONTEXT_OUT/muse/opencode/"
          cp .review-context/muse/.opencode/opencode.json "$CONTEXT_OUT/muse/opencode/opencode.json"
          cp .review-context/muse/.opencode/package.json "$CONTEXT_OUT/muse/opencode/package.json"
          cp .review-context/muse/.opencode/exposed-tools.txt "$CONTEXT_OUT/metadata/exposed-tools.txt"
          tar --exclude=.git -C .review-context/agents -cf - . | tar -C "$CONTEXT_OUT/agents" -xf -

          # The reviewer agent, prompt, and deterministic publisher are bound to
          # the pinned Muse revision. The recovery runner source is embedded in
          # this workflow so reusable callers receive the exact selected bytes.
          test -s "$CONTEXT_OUT/muse/opencode/agents/github-reviewer.md"
          cp .review-context/muse/.ημ/review/evidence-review.md "$CONTEXT_OUT/machinery/"
          cp .review-context/muse/.ημ/review/publish-opencode-review.cjs "$CONTEXT_OUT/machinery/"
          cp .review-context/muse/.ημ/review/publish-opencode-review.test.cjs "$CONTEXT_OUT/machinery/"

          base64 --decode > "$CONTEXT_OUT/machinery/run-opencode-review-recovery.mjs" <<'ETA_MU_RECOVERY_RUNNER_BASE64'
          Ly8gU1BEWC1MaWNlbnNlLUlkZW50aWZpZXI6IEdQTC0zLjAtb3ItbGF0ZXIKCmltcG9ydCB7IHNwYXduIH0gZnJvbSAibm9kZTpjaGlsZF9wcm9jZXNzIjsK
          aW1wb3J0IGZzIGZyb20gIm5vZGU6ZnMiOwppbXBvcnQgcGF0aCBmcm9tICJub2RlOnBhdGgiOwppbXBvcnQgeyBmaW5pc2hlZCB9IGZyb20gIm5vZGU6c3Ry
          ZWFtL3Byb21pc2VzIjsKaW1wb3J0IHsgZmlsZVVSTFRvUGF0aCB9IGZyb20gIm5vZGU6dXJsIjsKCmNvbnN0IFJFQ09WRVJZX1NDSEVNQSA9ICJvcGVuLWhh
          eC5yZXZpZXctcmVjb3ZlcnkvdjEiOwpjb25zdCBNQVhfQVRURU1QVFMgPSAyOwoKLy8gVGhlIG1vZGVsIHByb2Nlc3MgbmVlZHMgb25seSBhIGNvbnZlbnRp
          b25hbCB1c2VyL3J1bnRpbWUgZW52aXJvbm1lbnQgYW5kCi8vIG91dGJvdW5kIG5ldHdvcmsgY29uZmlndXJhdGlvbi4gSW4gcGFydGljdWxhciBpdCBtdXN0
          IG5vdCBpbmhlcml0IEdpdEh1YgovLyBBY3Rpb25zIHdvcmtmbG93LWNvbW1hbmQgZmlsZXMsIGFydGlmYWN0L2NhY2hlIHRva2VucywgT0lEQyBlbmRwb2lu
          dHMsIG9yCi8vIGFyYml0cmFyeSByZXBvc2l0b3J5IHNlY3JldHMgZnJvbSB0aGUgcnVubmVyIHByb2Nlc3MuCmNvbnN0IE9QRU5fQ09ERV9FTlZJUk9OTUVO
          VF9LRVlTID0gWwogICJDSSIsCiAgIkNPTE9SVEVSTSIsCiAgIkhPTUUiLAogICJIVFRQX1BST1hZIiwKICAiSFRUUFNfUFJPWFkiLAogICJMQU5HIiwKICAi
          TENfQUxMIiwKICAiTENfQ1RZUEUiLAogICJOT0RFX0VYVFJBX0NBX0NFUlRTIiwKICAiTk9fUFJPWFkiLAogICJPUEVOQ09ERV9ESVNBQkxFX0NMQVVERV9D
