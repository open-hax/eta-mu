name: eta-mu-extensions-tests

on:
  pull_request:
    paths:
      - 'packages/eta-mu-extensions/**'
      - '.github/workflows/eta-mu-extensions-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/eta-mu-extensions/**'
      - '.github/workflows/eta-mu-extensions-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/eta-mu-extensions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/eta-mu-extensions/package.json

      - name: Install deps
        run: npm install

      - name: Run tests
        run: npm test
