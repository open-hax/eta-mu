name: Rheos

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "packages/rheos/**"
      - "openhax.kanban.edn"
      - "openhax.kanban.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/rheos.yml"
  push:
    branches: [main]
    paths:
      - "packages/rheos/**"
      - "openhax.kanban.edn"
      - "openhax.kanban.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/rheos.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install clj-kondo
        uses: DeLaGuardo/setup-clojure@ada62bb3282a01a296659d48378b812b8e097360
        with:
          clj-kondo: 2025.10.23

      - name: Run clj-kondo
        working-directory: packages/rheos
        shell: bash
        run: |
          set -o pipefail
          clj-kondo --lint src test 2>&1 | tee rheos-kondo.log

      - name: Upload clj-kondo diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rheos-kondo-log
          path: packages/rheos/rheos-kondo.log
          if-no-files-found: error

  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.14.0"
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rheos tests
        run: pnpm -C packages/rheos test

      - name: Build Rheos release targets
        run: pnpm -C packages/rheos build
