name: rheos

on:
  push:
    branches: ["main"]
    paths:
      - "packages/rheos/**"
      - "packages/protocols/**"
      - "packages/chat-ui/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/rheos.yml"
  pull_request:
    paths:
      - "packages/rheos/**"
      - "packages/protocols/**"
      - "packages/chat-ui/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/rheos.yml"

jobs:
  test:
    name: Rheos tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"

      - uses: pnpm/action-setup@v4
        with:
          version: "10.14.0"
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install clj-kondo
        run: |
          curl -sLO https://raw.githubusercontent.com/clj-kondo/clj-kondo/master/script/install-clj-kondo
          chmod +x install-clj-kondo
          sudo ./install-clj-kondo

      - name: Test
        run: pnpm --dir packages/rheos test

      - name: Lint
        run: pnpm --dir packages/rheos lint:kondo

      - name: Upload shadow-cljs logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rheos-shadow-cljs-logs
          path: packages/rheos/.shadow-cljs/
          if-no-files-found: ignore
