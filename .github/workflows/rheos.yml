# Generated from contracts/workflows/ by scripts/workflows.bb — do not edit.
# Edit the workflow resource and run `eta-mu workflows emit`.
name: rheos
permissions:
  contents: read
'on':
  push:
    branches:
    - main
    paths:
    - packages/rheos/**
    - packages/protocols/**
    - packages/chat-ui/**
    - openhax.kanban.edn
    - openhax.kanban.json
    - kanban/openhax.kanban.*
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - .github/workflows/rheos.yml
  pull_request:
    paths:
    - packages/rheos/**
    - packages/protocols/**
    - packages/chat-ui/**
    - openhax.kanban.edn
    - openhax.kanban.json
    - kanban/openhax.kanban.*
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - .github/workflows/rheos.yml
jobs:
  test:
    name: Rheos tests and lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
      with:
        distribution: temurin
        java-version: '21'
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      with:
        version: 10.14.0
        run_install: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Get pnpm store path
      id: pnpm-cache
      run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ steps.pnpm-cache.outputs.store }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: ${{ runner.os }}-pnpm-
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Install clj-kondo
      uses: DeLaGuardo/setup-clojure@ada62bb3282a01a296659d48378b812b8e097360
      with:
        clj-kondo: 2025.10.23
    - name: Test
      run: pnpm --dir packages/rheos test
    - name: Lint
      run: pnpm --dir packages/rheos lint:kondo
    - name: Build Rheos release targets
      run: pnpm --dir packages/rheos build
    - name: Upload shadow-cljs logs
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: rheos-shadow-cljs-logs
        path: packages/rheos/.shadow-cljs/
        if-no-files-found: ignore
