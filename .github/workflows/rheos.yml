name: Rheos

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "packages/rheos/**"
      - "openhax.kanban.edn"
      - "openhax.kanban.json"
      - ".github/workflows/rheos.yml"
  push:
    branches: [main]
    paths:
      - "packages/rheos/**"
      - "openhax.kanban.edn"
      - "openhax.kanban.json"
      - ".github/workflows/rheos.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install clj-kondo
        run: |
          curl -sLO https://raw.githubusercontent.com/clj-kondo/clj-kondo/master/script/install-clj-kondo
          chmod +x install-clj-kondo
          sudo ./install-clj-kondo

      - name: Run clj-kondo
        shell: bash
        run: |
          set -o pipefail
          clj-kondo --lint packages/rheos/src packages/rheos/test 2>&1 | tee rheos-kondo.log

      - name: Upload clj-kondo diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rheos-kondo-log
          path: rheos-kondo.log
          if-no-files-found: error

  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"

      - uses: pnpm/action-setup@v4
        with:
          version: "10.14.0"
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Rheos tests
        run: pnpm -C packages/rheos test

      - name: Build Rheos release targets
        run: pnpm -C packages/rheos build
