name: eta-mu-staging-pr

on:
  pull_request:
    branches:
      - staging
    paths:
      - 'packages/legacy/docs/**'
      - 'packages/eta-mu-truth/**'
      - 'services/eta-mu/**'
      - 'services/eta-mu-truth-workbench/**'
      - '.github/workflows/eta-mu*.yml'
      - 'packages/legacy/github/**'

jobs:
  eta-mu-lint:
    name: eta-mu-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: '10.14.0'
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint

  eta-mu-docs-tests:
    name: eta-mu-docs-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: node --test packages/legacy/docs/tests/*.test.cjs

  eta-mu-truth-tests:
    name: eta-mu-truth-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: node --test packages/eta-mu-truth/tests/*.test.cjs

  eta-mu-compose-config:
    name: eta-mu-compose-config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: docker compose --project-name eta-mu-staging-ci -f services/eta-mu/compose.yaml config >/tmp/eta-mu-compose.txt
