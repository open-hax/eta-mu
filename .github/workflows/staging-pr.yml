name: eta-mu-staging-pr

on:
  pull_request:
    branches:
      - staging
    paths:
      - 'packages/legacy/docs/**'
      - 'packages/legacy/github/**'
      - '.github/workflows/*.yml'

jobs:
  eta-mu-lint:
    name: eta-mu-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: '10.14.0'
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint

  eta-mu-docs-tests:
    name: eta-mu-docs-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: node --test packages/legacy/docs/tests/*.test.cjs

  eta-mu-compose-config:
    name: eta-mu-compose-config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: echo "services/ removed; no compose config to validate in current layout"
