name: eta-mu-staging-pr

permissions: {}

on:
  pull_request:
    branches:
      - staging
    paths:
      - 'packages/legacy/docs/**'
      - 'packages/legacy/github/**'
      - '.github/workflows/*.yml'

jobs:
  eta-mu-lint:
    name: eta-mu-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10.14.0'
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @eta-mu/extensions build
      - run: pnpm lint

  eta-mu-docs-tests:
    name: eta-mu-docs-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: node --test packages/legacy/docs/tests/*.test.cjs

  eta-mu-compose-config:
    name: eta-mu-compose-config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          persist-credentials: false
      - run: echo "services/ removed; no compose config to validate in current layout"
