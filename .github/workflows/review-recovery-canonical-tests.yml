name: Canonical review recovery source controls
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/scripts/run-opencode-review-recovery.mjs'
      - '.github/scripts/opencode-code-review-workflow.test.mjs'
      - '.github/scripts/opencode-review-tool-recovery.test.mjs'
      - '.github/scripts/opencode-review-invocation-integrity.test.mjs'
      - '.github/scripts/review-invocation-fixture.mjs'
      - '.github/scripts/opencode-known-grep-overflow-source.test.mjs'
      - '.github/scripts/review-invocation-canonical-source-fixture.mjs'
      - '.github/workflows/opencode-code-review.yml'
      - '.github/workflows/review-recovery-canonical-tests.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout current candidate
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Checkout immutable Muse source
        uses: actions/checkout@v6
        with:
          repository: octave-commons/muse
          ref: c1369c223cf3c57e3e31934a6d746bfcdfe73f5a
          path: .review-test-muse
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Clojure CLI and Babashka
        uses: DeLaGuardo/setup-clojure@ada62bb3282a01a296659d48378b812b8e097360 # 13.4
        with:
          cli: 1.12.5.1654
          bb: '1.13.219'
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.14.0'
          run_install: false
      - name: Install locked caller test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compile the pinned canonical callback
        working-directory: .review-test-muse
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c1369c223cf3c57e3e31934a6d746bfcdfe73f5a
          npm ci --ignore-scripts --no-audit --no-fund
          clojure -M -m shadow.cljs.devtools.cli release review-invocation
      - name: Run original and canonical caller controls
        shell: bash
        run: |
          set -euo pipefail
          export REVIEW_TEST_CANONICAL_VERIFIER_FILE="$GITHUB_WORKSPACE/.review-test-muse/.opencode/dist/review-invocation.cjs"
          node --test .github/scripts/opencode-code-review-workflow.test.mjs .github/scripts/opencode-review-tool-recovery.test.mjs .github/scripts/opencode-review-invocation-integrity.test.mjs .github/scripts/opencode-known-grep-overflow-source.test.mjs
