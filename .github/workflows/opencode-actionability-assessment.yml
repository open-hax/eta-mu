name: Independent native actionability assessment

on:
  workflow_call:
    inputs:
      target_repository: {description: Native owner/name, required: true, type: string}
      target_repository_id: {description: Native numeric repository identity, required: true, type: string}
      pr_number: {required: true, type: string}
      head_sha: {required: true, type: string}
      thread_id: {required: true, type: string}
      proposal_id: {required: true, type: string}
      eta_revision: {description: Exact protected called workflow commit, required: true, type: string}
      review_timeout_minutes: {description: Whole minutes from 60 through 180, default: 60, type: number}
    secrets:
      ETA_MU_APP_ID: {required: true}
      ETA_MU_APP_PRIVATE_KEY: {required: true}
  workflow_dispatch:
    inputs:
      target_repository: {description: Native owner/name, required: true, type: string}
      target_repository_id: {description: Native numeric repository identity, required: true, type: string}
      pr_number: {required: true, type: string}
      head_sha: {required: true, type: string}
      thread_id: {required: true, type: string}
      proposal_id: {required: true, type: string}
      review_timeout_minutes: {description: Whole minutes from 60 through 180, default: 60, type: number}

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

# Immutable protected dependency sources. Fresh native/custody checks and
# complete applicable history remain prerequisites for live publication.
env:
  CANONICAL_REVISION: '80b8993bbd43cf0265c5e558c678845edc8929d9'
  MUSE_REVISION: '45c7a8d572bf44202f52cae2aa8c0f771736a617'
  ETA_SOURCE_SHA: ${{ inputs.eta_revision || github.workflow_sha }}
  ACTIONABILITY_CALLED_REVISION: ${{ inputs.eta_revision }}
  TARGET_REPOSITORY: ${{ inputs.target_repository }}
  TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
  TARGET_PR_NUMBER: ${{ inputs.pr_number }}
  TARGET_HEAD_SHA: ${{ inputs.head_sha }}
  TARGET_THREAD_ID: ${{ inputs.thread_id }}
  TARGET_PROPOSAL_ID: ${{ inputs.proposal_id }}
  CANONICAL_CHECKOUT: ${{ github.workspace }}/.actionability/canonical
  MUSE_CHECKOUT: ${{ github.workspace }}/.actionability/muse
  TARGET_CHECKOUT: ${{ github.workspace }}/.actionability/target
  ETA_CHECKOUT: ${{ github.workspace }}/.actionability/eta
  ACTIONABILITY_EVIDENCE_DIR: ${{ github.workspace }}/.actionability/model-root/.opencode/review-evidence
  ACTIONABILITY_PROFILE_DIR: ${{ github.workspace }}/.actionability/profile
  REVIEW_INVOCATION_VERIFIER_FILE: ${{ github.workspace }}/.actionability/profile/dist/review-invocation.cjs
  REVIEW_MODEL_DISCOVERY: opencode-free-mimo-flash-v1
  REVIEW_EXPECTED_OPENCODE_VERSION: '1.18.18'

# Every publishing run is owned by eta-mu; GitHub concurrency is repository-scoped.
# Other repositories request a dispatch here instead of calling from their own run.
concurrency:
  group: native-pr-assessment-${{ inputs.target_repository_id }}-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare actionability input
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      input_sha256: ${{ steps.prepare.outputs.input_sha256 }}
      profile_sha256: ${{ steps.profile.outputs.profile_sha256 }}
      verifier_sha256: ${{ steps.profile.outputs.verifier_sha256 }}
      invocation_id: ${{ job.check_run_id }}
    steps:
      - name: Refuse pending dependency pins and malformed time budget
        shell: bash
        env:
          TIMEOUT_INPUT: ${{ inputs.review_timeout_minutes }}
        run: |
          set -euo pipefail
          # The publisher App remains scoped to the configured open-hax owner.
          [[ "$TARGET_REPOSITORY" =~ ^open-hax/[A-Za-z0-9_.-]+$ ]]
          [[ "$TIMEOUT_INPUT" =~ ^[0-9]+$ ]] && (( TIMEOUT_INPUT >= 60 && TIMEOUT_INPUT <= 180 )) || {
            echo '::error::review_timeout_minutes must be a whole number from 60 through 180.'
            exit 1
          }
          [[ "$CANONICAL_REVISION" =~ ^[0-9a-f]{40}$ && "$MUSE_REVISION" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::Protected canonical/Muse dependency pins are not adopted.'
            exit 1
          }
      - name: Authenticate protected called source before checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONABILITY_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          ACTIONABILITY_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          ACTIONABILITY_JOB_CHECK_RUN_ID: ${{ job.check_run_id }}
          ACTIONABILITY_PREPARE_CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || {
            echo '::error::Actionability assessment requires a fresh workflow run; job reruns cannot reuse prior-attempt evidence.'
            exit 1
          }
          [[ "$GITHUB_REPOSITORY" == open-hax/eta-mu ]] || {
            echo '::error::Dispatch actionability assessment in open-hax/eta-mu to share its publication lock.'
            exit 1
          }
          [[ "$ETA_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Authenticate this job's defining workflow; a sibling entry in the
          # run's referenced_workflows aggregate cannot supply this identity.
          [[ "$ACTIONABILITY_JOB_WORKFLOW_SHA" == "$ETA_SOURCE_SHA" ]]
          [[ "$ACTIONABILITY_JOB_WORKFLOW_REF" =~ ^open-hax/eta-mu/\.github/workflows/opencode-actionability-assessment\.yml@.+$ ]]
          [[ "$ACTIONABILITY_JOB_CHECK_RUN_ID" =~ ^[1-9][0-9]{0,14}$ && "$ACTIONABILITY_PREPARE_CHECK_RUN_ID" =~ ^[1-9][0-9]{0,14}$ ]]
          default=$(gh api repos/open-hax/eta-mu --jq .default_branch)
          branch=$(gh api "repos/open-hax/eta-mu/branches/$default")
          jq -e '.protected == true' <<< "$branch" > /dev/null
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          jq -e --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" --arg repo "$GITHUB_REPOSITORY" \
            '.id == $run and .run_attempt == $attempt and .repository.full_name == $repo' <<< "$run" > /dev/null
          # A called workflow inherits the caller event, including manual
          # dispatch. Only workflow_call declares the required eta_revision.
          if [[ -z "$ACTIONABILITY_CALLED_REVISION" ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
            [[ "$GITHUB_REPOSITORY" == open-hax/eta-mu ]]
            [[ "$GITHUB_WORKFLOW_REF" == "open-hax/eta-mu/.github/workflows/opencode-actionability-assessment.yml@refs/heads/$default" ]]
            [[ "$GITHUB_WORKFLOW_SHA" == "$ETA_SOURCE_SHA" ]]
            [[ "$ACTIONABILITY_JOB_WORKFLOW_REF" == "$GITHUB_WORKFLOW_REF" ]]
            [[ $(jq -r .commit.sha <<< "$branch") == "$ETA_SOURCE_SHA" ]]
            jq -e --arg sha "$ETA_SOURCE_SHA" '.head_sha == $sha' <<< "$run" > /dev/null
          else
            [[ "$ACTIONABILITY_CALLED_REVISION" =~ ^[0-9a-f]{40}$ && "$ACTIONABILITY_CALLED_REVISION" == "$ETA_SOURCE_SHA" ]]
            jq -e --arg sha "$ETA_SOURCE_SHA" \
              '.referenced_workflows | any(.sha == $sha and (.path | startswith("open-hax/eta-mu/.github/workflows/opencode-actionability-assessment.yml@")))' <<< "$run" > /dev/null
            gh api "repos/open-hax/eta-mu/compare/$ETA_SOURCE_SHA...$default" --jq .status | grep -Ex 'ahead|identical' > /dev/null
          fi
          # Carry only validated step context into later host entrypoints.
          printf 'ACTIONABILITY_JOB_WORKFLOW_SHA=%s\nACTIONABILITY_JOB_WORKFLOW_REF=%s\nACTIONABILITY_PREPARE_CHECK_RUN_ID=%s\n' \
            "$ACTIONABILITY_JOB_WORKFLOW_SHA" "$ACTIONABILITY_JOB_WORKFLOW_REF" "$ACTIONABILITY_PREPARE_CHECK_RUN_ID" >> "$GITHUB_ENV"
          if [[ -n "${ACTIONABILITY_ASSESS_CHECK_RUN_ID:-}" ]]; then
            [[ "$ACTIONABILITY_ASSESS_CHECK_RUN_ID" =~ ^[1-9][0-9]{0,14}$ ]]
            printf 'ACTIONABILITY_ASSESS_CHECK_RUN_ID=%s\n' "$ACTIONABILITY_ASSESS_CHECK_RUN_ID" >> "$GITHUB_ENV"
          fi
      - name: Require public native target before checkout
        id: target_identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_REPOSITORY" =~ ^open-hax/[A-Za-z0-9_.-]+$ ]]
          [[ "$TARGET_REPOSITORY_ID" =~ ^[1-9][0-9]{0,14}$ ]]
          target=$(gh api "repos/$TARGET_REPOSITORY")
          jq -e --arg name "$TARGET_REPOSITORY" --argjson id "$TARGET_REPOSITORY_ID" \
            '.full_name == $name and .id == $id and .visibility == "public" and .private == false' <<< "$target" > /dev/null || {
            echo '::error::Assessment requires known public target repository visibility and matching native identity.'
            exit 1
          }
          printf 'repository_name=%s\n' "${TARGET_REPOSITORY#open-hax/}" >> "$GITHUB_OUTPUT"
      - name: Create target-scoped native read token
        id: target_reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.ETA_MU_APP_ID }}
          private-key: ${{ secrets.ETA_MU_APP_PRIVATE_KEY }}
          owner: open-hax
          repositories: ${{ steps.target_identity.outputs.repository_name }}
          permission-metadata: read
          permission-pull-requests: read
          permission-issues: read
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: open-hax/eta-mu, ref: '${{ env.ETA_SOURCE_SHA }}', path: .actionability/eta, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: riatzukiza/.agents, ref: '${{ env.CANONICAL_REVISION }}', path: .actionability/canonical, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: octave-commons/muse, ref: '${{ env.MUSE_REVISION }}', path: .actionability/muse, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: '${{ inputs.target_repository }}', ref: '${{ inputs.head_sha }}', path: .actionability/target, fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21'}
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08
        with: {cli: 1.12.5.1654}
      - name: Install pinned one-shot host runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/actionability-host-home" "$ACTIONABILITY_EVIDENCE_DIR" "$ACTIONABILITY_PROFILE_DIR"
          mkdir -m 700 .actionability/runtime
          cp "$ETA_CHECKOUT/.github/assessment-runtime/package.json" "$ETA_CHECKOUT/.github/assessment-runtime/package-lock.json" .actionability/runtime/
          npm ci --prefix .actionability/runtime --ignore-scripts --no-audit --no-fund
          ln -s "$GITHUB_WORKSPACE/.actionability/runtime/node_modules" "$ETA_CHECKOUT/node_modules"
      - name: Reuse protected read-only Muse profile compilation
        shell: bash
        env:
          PROFILE_SCRIPT_FILE: ${{ runner.temp }}/actionability-profile.sh
          ETA_WORKFLOW_FILE: ${{ github.workspace }}/.actionability/eta/.github/workflows/opencode-code-review.yml
        run: |
          set -euo pipefail
          node .actionability/runtime/node_modules/nbb/cli.js -cp "$ETA_CHECKOUT/packages/eta-mu/src/cljs:$CANONICAL_CHECKOUT/skills/pr-flow/scripts" "$ETA_CHECKOUT/.github/scripts/opencode_actionability_assessment.cljs" profile
          mkdir -m 700 "$RUNNER_TEMP/actionability-muse-build"
          git -C "$MUSE_CHECKOUT" archive "$MUSE_REVISION" | tar -x -C "$RUNNER_TEMP/actionability-muse-build"
          (cd "$RUNNER_TEMP/actionability-muse-build" && bash "$PROFILE_SCRIPT_FILE")
          cp -a "$RUNNER_TEMP/actionability-muse-build/.opencode/dist" "$ACTIONABILITY_PROFILE_DIR/"
          cp -a "$RUNNER_TEMP/actionability-muse-build/.opencode/agents" "$ACTIONABILITY_PROFILE_DIR/"
          cp "$RUNNER_TEMP/actionability-muse-build/.opencode/opencode.json" "$ACTIONABILITY_PROFILE_DIR/"
          cp "$RUNNER_TEMP/actionability-muse-build/.opencode/package.json" "$ACTIONABILITY_PROFILE_DIR/"
          cmp "$RUNNER_TEMP/actionability-muse-build/.opencode/package.json" "$ETA_CHECKOUT/.github/assessment-model-profile/package.json"
          if [[ -f "$RUNNER_TEMP/actionability-muse-build/.opencode/package-lock.json" ]]; then
            cp "$RUNNER_TEMP/actionability-muse-build/.opencode/package-lock.json" "$ACTIONABILITY_PROFILE_DIR/"
          else
            cp "$ETA_CHECKOUT/.github/assessment-model-profile/package-lock.json" "$ACTIONABILITY_PROFILE_DIR/"
          fi
          cp "$RUNNER_TEMP/actionability-muse-build/.opencode/exposed-tools.txt" "$ACTIONABILITY_EVIDENCE_DIR/tools.txt"
      - name: Bind compiled profile outside the child
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          export HOST_CP="$ETA_CHECKOUT/packages/eta-mu/src/cljs:$CANONICAL_CHECKOUT/skills/pr-flow/scripts"
          profile_sha=$(node .actionability/runtime/node_modules/nbb/cli.js -cp "$HOST_CP" -e '(require (quote [eta-mu.extern.actionability-host :as h])) (println (h/directory-digest (h/env "ACTIONABILITY_PROFILE_DIR")))')
          verifier_sha=$(sha256sum "$REVIEW_INVOCATION_VERIFIER_FILE" | cut -d ' ' -f 1)
          echo "profile_sha256=$profile_sha" >> "$GITHUB_OUTPUT"
          echo "verifier_sha256=$verifier_sha" >> "$GITHUB_OUTPUT"
      - name: Fresh native collection and immutable source input
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ steps.target_reader.outputs.token }}
          HOST_RUN_READ_TOKEN: ${{ github.token }}
          ACTIONABILITY_HOST_HOME: ${{ runner.temp }}/actionability-host-home
          PREPARED_PROFILE_SHA256: ${{ steps.profile.outputs.profile_sha256 }}
          REVIEW_INVOCATION_VERIFIER_SHA256: ${{ steps.profile.outputs.verifier_sha256 }}
        run: |
          set -euo pipefail
          node .actionability/runtime/node_modules/nbb/cli.js -cp "$ETA_CHECKOUT/packages/eta-mu/src/cljs:$CANONICAL_CHECKOUT/skills/pr-flow/scripts" "$ETA_CHECKOUT/.github/scripts/opencode_actionability_assessment.cljs" prepare > "$RUNNER_TEMP/actionability-prepared.json"
          input_sha=$(node .actionability/runtime/node_modules/nbb/cli.js -e '(require (quote ["node:fs" :as f])) (println (aget (js/JSON.parse (.readFileSync f (str (.-RUNNER_TEMP (.-env js/process)) "/actionability-prepared.json") "utf8")) "input-sha256"))')
          echo "input_sha256=$input_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'actionability-input-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}', path: .actionability/model-root/.opencode/review-evidence, if-no-files-found: error, include-hidden-files: true}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'actionability-profile-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}', path: .actionability/profile, if-no-files-found: error, include-hidden-files: true}

  assess:
    name: Assess complete actionability input
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.review_timeout_minutes > 180 && 180 || (inputs.review_timeout_minutes > 60 && inputs.review_timeout_minutes || 60) }}
    outputs:
      accepted_sha256: ${{ steps.assess.outputs.review_invocation_sha256 }}
      check_run_id: ${{ job.check_run_id }}
    steps:
      - name: Authenticate protected called source before checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONABILITY_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          ACTIONABILITY_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          ACTIONABILITY_JOB_CHECK_RUN_ID: ${{ job.check_run_id }}
          ACTIONABILITY_PREPARE_CHECK_RUN_ID: ${{ needs.prepare.outputs.invocation_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || {
            echo '::error::Actionability assessment requires a fresh workflow run; job reruns cannot reuse prior-attempt evidence.'
            exit 1
          }
          [[ "$GITHUB_REPOSITORY" == open-hax/eta-mu ]] || {
            echo '::error::Dispatch actionability assessment in open-hax/eta-mu to share its publication lock.'
            exit 1
          }
          [[ "$ETA_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Authenticate this job's defining workflow; a sibling entry in the
          # run's referenced_workflows aggregate cannot supply this identity.
          [[ "$ACTIONABILITY_JOB_WORKFLOW_SHA" == "$ETA_SOURCE_SHA" ]]
          [[ "$ACTIONABILITY_JOB_WORKFLOW_REF" =~ ^open-hax/eta-mu/\.github/workflows/opencode-actionability-assessment\.yml@.+$ ]]
          [[ "$ACTIONABILITY_JOB_CHECK_RUN_ID" =~ ^[1-9][0-9]{0,14}$ && "$ACTIONABILITY_PREPARE_CHECK_RUN_ID" =~ ^[1-9][0-9]{0,14}$ ]]
          default=$(gh api repos/open-hax/eta-mu --jq .default_branch)
          branch=$(gh api "repos/open-hax/eta-mu/branches/$default")
          jq -e '.protected == true' <<< "$branch" > /dev/null
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          jq -e --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" --arg repo "$GITHUB_REPOSITORY" \
            '.id == $run and .run_attempt == $attempt and .repository.full_name == $repo' <<< "$run" > /dev/null
          # A called workflow inherits the caller event, including manual
          # dispatch. Only workflow_call declares the required eta_revision.
          if [[ -z "$ACTIONABILITY_CALLED_REVISION" ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
            [[ "$GITHUB_REPOSITORY" == open-hax/eta-mu ]]
            [[ "$GITHUB_WORKFLOW_REF" == "open-hax/eta-mu/.github/workflows/opencode-actionability-assessment.yml@refs/heads/$default" ]]
            [[ "$GITHUB_WORKFLOW_SHA" == "$ETA_SOURCE_SHA" ]]
            [[ "$ACTIONABILITY_JOB_WORKFLOW_REF" == "$GITHUB_WORKFLOW_REF" ]]
            [[ $(jq -r .commit.sha <<< "$branch") == "$ETA_SOURCE_SHA" ]]
            jq -e --arg sha "$ETA_SOURCE_SHA" '.head_sha == $sha' <<< "$run" > /dev/null
          else
            [[ "$ACTIONABILITY_CALLED_REVISION" =~ ^[0-9a-f]{40}$ && "$ACTIONABILITY_CALLED_REVISION" == "$ETA_SOURCE_SHA" ]]
            jq -e --arg sha "$ETA_SOURCE_SHA" \
              '.referenced_workflows | any(.sha == $sha and (.path | startswith("open-hax/eta-mu/.github/workflows/opencode-actionability-assessment.yml@")))' <<< "$run" > /dev/null
            gh api "repos/open-hax/eta-mu/compare/$ETA_SOURCE_SHA...$default" --jq .status | grep -Ex 'ahead|identical' > /dev/null
          fi
          # Carry only validated step context into later host entrypoints.
          printf 'ACTIONABILITY_JOB_WORKFLOW_SHA=%s\nACTIONABILITY_JOB_WORKFLOW_REF=%s\nACTIONABILITY_PREPARE_CHECK_RUN_ID=%s\n' \
            "$ACTIONABILITY_JOB_WORKFLOW_SHA" "$ACTIONABILITY_JOB_WORKFLOW_REF" "$ACTIONABILITY_PREPARE_CHECK_RUN_ID" >> "$GITHUB_ENV"
          if [[ -n "${ACTIONABILITY_ASSESS_CHECK_RUN_ID:-}" ]]; then
            [[ "$ACTIONABILITY_ASSESS_CHECK_RUN_ID" =~ ^[1-9][0-9]{0,14}$ ]]
            printf 'ACTIONABILITY_ASSESS_CHECK_RUN_ID=%s\n' "$ACTIONABILITY_ASSESS_CHECK_RUN_ID" >> "$GITHUB_ENV"
          fi
      - name: Require public native target before checkout
        id: target_identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_REPOSITORY" =~ ^open-hax/[A-Za-z0-9_.-]+$ ]]
          [[ "$TARGET_REPOSITORY_ID" =~ ^[1-9][0-9]{0,14}$ ]]
          target=$(gh api "repos/$TARGET_REPOSITORY")
          jq -e --arg name "$TARGET_REPOSITORY" --argjson id "$TARGET_REPOSITORY_ID" \
            '.full_name == $name and .id == $id and .visibility == "public" and .private == false' <<< "$target" > /dev/null || {
            echo '::error::Assessment requires known public target repository visibility and matching native identity.'
            exit 1
          }
          printf 'repository_name=%s\n' "${TARGET_REPOSITORY#open-hax/}" >> "$GITHUB_OUTPUT"
      - name: Create target-scoped native read token
        id: target_reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.ETA_MU_APP_ID }}
          private-key: ${{ secrets.ETA_MU_APP_PRIVATE_KEY }}
          owner: open-hax
          repositories: ${{ steps.target_identity.outputs.repository_name }}
          permission-metadata: read
          permission-pull-requests: read
          permission-issues: read
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: open-hax/eta-mu, ref: '${{ env.ETA_SOURCE_SHA }}', path: .actionability/eta, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: riatzukiza/.agents, ref: '${{ env.CANONICAL_REVISION }}', path: .actionability/canonical, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: octave-commons/muse, ref: '${{ env.MUSE_REVISION }}', path: .actionability/muse, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: '${{ inputs.target_repository }}', ref: '${{ inputs.head_sha }}', path: .actionability/target, fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'actionability-input-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.prepare.outputs.invocation_id }}', path: .actionability/model-root/.opencode/review-evidence}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'actionability-profile-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.prepare.outputs.invocation_id }}', path: .actionability/profile}
      - name: Install isolated credential-free model profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/actionability-model-home" "$RUNNER_TEMP/actionability-host-home"
          chmod 700 "$ACTIONABILITY_EVIDENCE_DIR" "$ACTIONABILITY_PROFILE_DIR"
          mkdir -m 700 .actionability/runtime
          cp "$ETA_CHECKOUT/.github/assessment-runtime/package.json" "$ETA_CHECKOUT/.github/assessment-runtime/package-lock.json" .actionability/runtime/
          npm ci --prefix .actionability/runtime --ignore-scripts --no-audit --no-fund
          ln -s "$GITHUB_WORKSPACE/.actionability/runtime/node_modules" "$ETA_CHECKOUT/node_modules"
          MODEL_HOME="$RUNNER_TEMP/actionability-model-home"
          mkdir -m 700 "$MODEL_HOME/tmp"
          mkdir -p "$MODEL_HOME/.config/opencode/plugins" "$MODEL_HOME/.config/opencode/agents" "$MODEL_HOME/.eta-mu-review"
          cp -a "$ACTIONABILITY_PROFILE_DIR/dist" "$MODEL_HOME/.eta-mu-review/"
          cmp "$ACTIONABILITY_PROFILE_DIR/package.json" "$ETA_CHECKOUT/.github/assessment-model-profile/package.json"
          cp "$ACTIONABILITY_PROFILE_DIR/package.json" "$ACTIONABILITY_PROFILE_DIR/package-lock.json" "$MODEL_HOME/.eta-mu-review/"
          npm ci --prefix "$MODEL_HOME/.eta-mu-review" --ignore-scripts --no-audit --no-fund
          printf 'export { EtaMuActorsPlugin } from "%s/dist/eta-mu-actors.js";\n' "$MODEL_HOME/.eta-mu-review" > "$MODEL_HOME/.config/opencode/plugins/eta-mu-actors.js"
          cp "$ACTIONABILITY_PROFILE_DIR/agents/github-reviewer.md" "$MODEL_HOME/.config/opencode/agents/"
          cp "$ACTIONABILITY_PROFILE_DIR/opencode.json" "$MODEL_HOME/.config/opencode/"
          mkdir "$MODEL_HOME/.agents"
          cp -a "$CANONICAL_CHECKOUT/skills" "$MODEL_HOME/.agents/"
          mkdir -m 700 "$MODEL_HOME/.eta-mu-opencode"
          cp "$ETA_CHECKOUT/.github/assessment-opencode/package.json" "$ETA_CHECKOUT/.github/assessment-opencode/package-lock.json" "$MODEL_HOME/.eta-mu-opencode/"
          npm ci --prefix "$MODEL_HOME/.eta-mu-opencode" --ignore-scripts --no-audit --no-fund --omit=optional
          test -x "$MODEL_HOME/.eta-mu-opencode/node_modules/opencode-linux-x64-baseline/bin/opencode"
      - name: Bind staged input before model execution
        shell: bash
        env:
          GH_TOKEN: ${{ steps.target_reader.outputs.token }}
          HOST_RUN_READ_TOKEN: ${{ github.token }}
          ACTIONABILITY_HOST_HOME: ${{ runner.temp }}/actionability-host-home
          PREPARED_INPUT_SHA256: ${{ needs.prepare.outputs.input_sha256 }}
          PREPARED_PROFILE_SHA256: ${{ needs.prepare.outputs.profile_sha256 }}
          REVIEW_INVOCATION_VERIFIER_SHA256: ${{ needs.prepare.outputs.verifier_sha256 }}
        run: |
          set -euo pipefail
          node .actionability/runtime/node_modules/nbb/cli.js -cp "$ETA_CHECKOUT/packages/eta-mu/src/cljs:$CANONICAL_CHECKOUT/skills/pr-flow/scripts" "$ETA_CHECKOUT/.github/scripts/opencode_actionability_assessment.cljs" input
      - name: Actual bounded credential-free invocation
        id: assess
        working-directory: .actionability/model-root
        shell: bash
        env:
          REVIEW_INPUT_PURPOSE: actionability
          REVIEW_CHILD_HOME: ${{ runner.temp }}/actionability-model-home
          OPENCODE_BIN: ${{ runner.temp }}/actionability-model-home/.eta-mu-opencode/node_modules/opencode-linux-x64-baseline/bin/opencode
          REVIEW_EVIDENCE_DIR: ${{ github.workspace }}/.actionability/model-root/.opencode/review-evidence
          REVIEW_PROMPT_FILE: ${{ github.workspace }}/.actionability/model-root/.opencode/review-evidence/prompt.txt
          REVIEW_TOOL_REGISTRY_FILE: ${{ github.workspace }}/.actionability/model-root/.opencode/review-evidence/tools.txt
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_MODEL: ''
        run: node "$ETA_CHECKOUT/.github/scripts/run-opencode-review-recovery.mjs"
      - name: Reverify actual accepted invocation and fresh custody
        shell: bash
        env:
          GH_TOKEN: ${{ steps.target_reader.outputs.token }}
          HOST_RUN_READ_TOKEN: ${{ github.token }}
          ACTIONABILITY_HOST_HOME: ${{ runner.temp }}/actionability-host-home
          PREPARED_INPUT_SHA256: ${{ needs.prepare.outputs.input_sha256 }}
          PREPARED_PROFILE_SHA256: ${{ needs.prepare.outputs.profile_sha256 }}
          REVIEW_INVOCATION_VERIFIER_SHA256: ${{ needs.prepare.outputs.verifier_sha256 }}
        run: |
          set -euo pipefail
          node .actionability/runtime/node_modules/nbb/cli.js -cp "$ETA_CHECKOUT/packages/eta-mu/src/cljs:$CANONICAL_CHECKOUT/skills/pr-flow/scripts" "$ETA_CHECKOUT/.github/scripts/opencode_actionability_assessment.cljs" verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'actionability-result-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.prepare.outputs.invocation_id }}', path: .actionability/model-root/.opencode/review-evidence, if-no-files-found: error, include-hidden-files: true}

  publish:
    name: Publish qualified actionability issue comment
    needs: [prepare, assess]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: actionability-publication
    steps:
      - name: Authenticate protected called source before checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONABILITY_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          ACTIONABILITY_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          ACTIONABILITY_JOB_CHECK_RUN_ID: ${{ job.check_run_id }}
          ACTIONABILITY_PREPARE_CHECK_RUN_ID: ${{ needs.prepare.outputs.invocation_id }}
          ACTIONABILITY_ASSESS_CHECK_RUN_ID: ${{ needs.assess.outputs.check_run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || {
            echo '::error::Actionability assessment requires a fresh workflow run; job reruns cannot reuse prior-attempt evidence.'
            exit 1
          }
          [[ "$GITHUB_REPOSITORY" == open-hax/eta-mu ]] || {
            echo '::error::Dispatch actionability assessment in open-hax/eta-mu to share its publication lock.'
            exit 1
          }
          [[ "$ETA_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          # Authenticate this job's defining workflow; a sibling entry in the
          # run's referenced_workflows aggregate cannot supply this identity.
          [[ "$ACTIONABILITY_JOB_WORKFLOW_SHA" == "$ETA_SOURCE_SHA" ]]
          [[ "$ACTIONABILITY_JOB_WORKFLOW_REF" =~ ^open-hax/eta-mu/\.github/workflows/opencode-actionability-assessment\.yml@.+$ ]]
          [[ "$ACTIONABILITY_JOB_CHECK_RUN_ID" =~ ^[1-9][0-9]{0,14}$ && "$ACTIONABILITY_PREPARE_CHECK_RUN_ID" =~ ^[1-9][0-9]{0,14}$ ]]
          default=$(gh api repos/open-hax/eta-mu --jq .default_branch)
          branch=$(gh api "repos/open-hax/eta-mu/branches/$default")
          jq -e '.protected == true' <<< "$branch" > /dev/null
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          jq -e --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" --arg repo "$GITHUB_REPOSITORY" \
            '.id == $run and .run_attempt == $attempt and .repository.full_name == $repo' <<< "$run" > /dev/null
          # A called workflow inherits the caller event, including manual
          # dispatch. Only workflow_call declares the required eta_revision.
          if [[ -z "$ACTIONABILITY_CALLED_REVISION" ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
            [[ "$GITHUB_REPOSITORY" == open-hax/eta-mu ]]
            [[ "$GITHUB_WORKFLOW_REF" == "open-hax/eta-mu/.github/workflows/opencode-actionability-assessment.yml@refs/heads/$default" ]]
            [[ "$GITHUB_WORKFLOW_SHA" == "$ETA_SOURCE_SHA" ]]
            [[ "$ACTIONABILITY_JOB_WORKFLOW_REF" == "$GITHUB_WORKFLOW_REF" ]]
            [[ $(jq -r .commit.sha <<< "$branch") == "$ETA_SOURCE_SHA" ]]
            jq -e --arg sha "$ETA_SOURCE_SHA" '.head_sha == $sha' <<< "$run" > /dev/null
          else
            [[ "$ACTIONABILITY_CALLED_REVISION" =~ ^[0-9a-f]{40}$ && "$ACTIONABILITY_CALLED_REVISION" == "$ETA_SOURCE_SHA" ]]
            jq -e --arg sha "$ETA_SOURCE_SHA" \
              '.referenced_workflows | any(.sha == $sha and (.path | startswith("open-hax/eta-mu/.github/workflows/opencode-actionability-assessment.yml@")))' <<< "$run" > /dev/null
            gh api "repos/open-hax/eta-mu/compare/$ETA_SOURCE_SHA...$default" --jq .status | grep -Ex 'ahead|identical' > /dev/null
          fi
          # Carry only validated step context into later host entrypoints.
          printf 'ACTIONABILITY_JOB_WORKFLOW_SHA=%s\nACTIONABILITY_JOB_WORKFLOW_REF=%s\nACTIONABILITY_PREPARE_CHECK_RUN_ID=%s\n' \
            "$ACTIONABILITY_JOB_WORKFLOW_SHA" "$ACTIONABILITY_JOB_WORKFLOW_REF" "$ACTIONABILITY_PREPARE_CHECK_RUN_ID" >> "$GITHUB_ENV"
          if [[ -n "${ACTIONABILITY_ASSESS_CHECK_RUN_ID:-}" ]]; then
            [[ "$ACTIONABILITY_ASSESS_CHECK_RUN_ID" =~ ^[1-9][0-9]{0,14}$ ]]
            printf 'ACTIONABILITY_ASSESS_CHECK_RUN_ID=%s\n' "$ACTIONABILITY_ASSESS_CHECK_RUN_ID" >> "$GITHUB_ENV"
          fi
      - name: Require public native target before checkout
        id: target_identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_REPOSITORY" =~ ^open-hax/[A-Za-z0-9_.-]+$ ]]
          [[ "$TARGET_REPOSITORY_ID" =~ ^[1-9][0-9]{0,14}$ ]]
          target=$(gh api "repos/$TARGET_REPOSITORY")
          jq -e --arg name "$TARGET_REPOSITORY" --argjson id "$TARGET_REPOSITORY_ID" \
            '.full_name == $name and .id == $id and .visibility == "public" and .private == false' <<< "$target" > /dev/null || {
            echo '::error::Assessment requires known public target repository visibility and matching native identity.'
            exit 1
          }
          printf 'repository_name=%s\n' "${TARGET_REPOSITORY#open-hax/}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: open-hax/eta-mu, ref: '${{ env.ETA_SOURCE_SHA }}', path: .actionability/eta, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: riatzukiza/.agents, ref: '${{ env.CANONICAL_REVISION }}', path: .actionability/canonical, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: octave-commons/muse, ref: '${{ env.MUSE_REVISION }}', path: .actionability/muse, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: '${{ inputs.target_repository }}', ref: '${{ inputs.head_sha }}', path: .actionability/target, fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'actionability-result-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.prepare.outputs.invocation_id }}', path: .actionability/model-root/.opencode/review-evidence}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'actionability-profile-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.prepare.outputs.invocation_id }}', path: .actionability/profile}
      - name: Install protected one-shot publisher runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/actionability-host-home"
          chmod 700 "$ACTIONABILITY_EVIDENCE_DIR" "$ACTIONABILITY_PROFILE_DIR"
          mkdir -m 700 .actionability/runtime
          cp "$ETA_CHECKOUT/.github/assessment-runtime/package.json" "$ETA_CHECKOUT/.github/assessment-runtime/package-lock.json" .actionability/runtime/
          npm ci --prefix .actionability/runtime --ignore-scripts --no-audit --no-fund
          ln -s "$GITHUB_WORKSPACE/.actionability/runtime/node_modules" "$ETA_CHECKOUT/node_modules"
      - name: Create separate protected issue-comment token
        id: publisher
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.ETA_MU_APP_ID }}
          private-key: ${{ secrets.ETA_MU_APP_PRIVATE_KEY }}
          owner: open-hax
          repositories: ${{ steps.target_identity.outputs.repository_name }}
          permission-issues: write
          permission-pull-requests: read
          permission-contents: read
          permission-actions: read
      - name: Fresh canonical eligibility, authentic App grants, single write and readback
        shell: bash
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          HOST_RUN_READ_TOKEN: ${{ github.token }}
          ETA_MU_APP_ID: ${{ secrets.ETA_MU_APP_ID }}
          ETA_MU_APP_PRIVATE_KEY: ${{ secrets.ETA_MU_APP_PRIVATE_KEY }}
          ACTIONABILITY_INSTALLATION_ID: ${{ steps.publisher.outputs.installation-id }}
          ACTIONABILITY_APP_SLUG: ${{ steps.publisher.outputs.app-slug }}
          ACTIONABILITY_HOST_HOME: ${{ runner.temp }}/actionability-host-home
          PREPARED_INPUT_SHA256: ${{ needs.prepare.outputs.input_sha256 }}
          PREPARED_PROFILE_SHA256: ${{ needs.prepare.outputs.profile_sha256 }}
          REVIEW_INVOCATION_VERIFIER_SHA256: ${{ needs.prepare.outputs.verifier_sha256 }}
          ACCEPTED_INVOCATION_SHA256: ${{ needs.assess.outputs.accepted_sha256 }}
          PUBLICATION_RESULT_FILE: ${{ runner.temp }}/actionability-publication-result.json
        run: |
          set -euo pipefail
          publication_exit=0
          node .actionability/runtime/node_modules/nbb/cli.js -cp "$ETA_CHECKOUT/packages/eta-mu/src/cljs:$CANONICAL_CHECKOUT/skills/pr-flow/scripts" "$ETA_CHECKOUT/.github/scripts/opencode_actionability_assessment.cljs" publish || publication_exit=$?
          # Preserve exclusive host-written bytes. A missing terminal file establishes no effect.
          if [[ ! -e "$PUBLICATION_RESULT_FILE" ]]; then
            printf '%s\n' '{"status":"unestablished","outcome":"unknown","refusal-code":"host-did-not-complete","write-intent-performed":null,"retry-performed":false,"admitted":false,"native-resolution-performed":false,"review-credit":false}' > "$PUBLICATION_RESULT_FILE"
            (( publication_exit != 0 )) || publication_exit=1
          fi
          exit "$publication_exit"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'actionability-publication-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.prepare.outputs.invocation_id }}', path: '${{ runner.temp }}/actionability-publication-result.json', if-no-files-found: error}
