# SPDX-License-Identifier: GPL-3.0-or-later
name: Sol CI

on:
  pull_request:
    paths:
      - "packages/sol/**"
      - "packages/turn-processor/**"
      - "packages/eta-mu/**"
      - ".github/workflows/sol-ci.yml"
      - ".github/workflows/sol-trusted-integration.yml"
      - ".github/scripts/sol-ci-workflow.test.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches: [main, staging]
    paths:
      - "packages/sol/**"
      - "packages/turn-processor/**"
      - "packages/eta-mu/**"
      - ".github/workflows/sol-ci.yml"
      - ".github/workflows/sol-trusted-integration.yml"
      - ".github/scripts/sol-ci-workflow.test.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact event revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact and clean checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          expected_sha="$EXPECTED_SHA"
          executed_sha="$(git rev-parse HEAD)"
          checkout_status="$(git status --porcelain --untracked-files=all)"
          if [[ ! "$expected_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Sol CI expected revision is not an immutable SHA: ${expected_sha:-missing}"
            exit 1
          fi
          if [[ "$executed_sha" != "$expected_sha" ]]; then
            echo "::error::Sol CI executed $executed_sha instead of exact revision $expected_sha."
            exit 1
          fi
          if [[ -n "$checkout_status" ]]; then
            echo "::error::Sol CI checkout was dirty before validation."
            printf '%s\n' "$checkout_status"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Clojure CLI and clj-kondo
        uses: DeLaGuardo/setup-clojure@ada62bb3282a01a296659d48378b812b8e097360 # 13.4
        with:
          cli: 1.12.5.1654
          clj-kondo: 2025.10.23

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.14.0"
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Pull-request execution ends after public-source static validation. A
      # fresh GitHub-hosted runner therefore never receives the private source
      # or App capability that PR-controlled code could read or exfiltrate.
      - name: Lint Sol public source and tests
        working-directory: packages/sol
        shell: bash
        run: |
          set -o pipefail
          # Run from the package root so clj-kondo loads Sol's checked-in
          # async/macro hooks without installing any pull-request dependency.
          clj-kondo --lint src/cljs test/cljs 2>&1 | tee sol-lint.log
          node ../../scripts/contract-guard.mjs src/cljs test/cljs 2>&1 | tee -a sol-lint.log

      - name: Record pull-request private-integration boundary
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          {
            echo "Sol pull-request validation is exact-head public-source lint only."
            echo "Katamorph/event-ledger source and App credentials are intentionally absent."
            echo "Full private-dependency test/build runs only for trusted main/staging push revisions."
          } | tee sol-private-integration-deferred.log
